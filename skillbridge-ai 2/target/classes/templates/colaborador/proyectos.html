<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis proyectos · SkillBridge AI</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>
<script th:inline="javascript">try{sessionStorage.setItem("sbai_active_role", /*[[${rolSlug}]]*/ "colaborador");}catch(e){}</script>

<div class="app-shell">
  <aside class="sidebar" id="sbai-sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="sbai-topbar"></header>
    <main class="page-content" id="page-content">

      <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="actuales">Proyectos actuales</button>
        <button type="button" class="tab-btn" data-tab="historial">Historial completo</button>
      </div>

      <div id="tab-actuales" class="grid-cards" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:var(--space-5);"></div>

      <section class="card" id="tab-historial" hidden>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Proyecto</th><th>Cliente</th><th>Rol</th><th>Periodo</th><th>Estado</th></tr></thead>
            <tbody id="historial-body"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>
</div>

<script src="/js/mock-data.js"></script>
<script src="/js/state.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/dropdown.js"></script>
<script src="/js/table-filter.js"></script>
<script src="/js/command-palette.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/shell.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var cfg = SBAI.shell.init({ role: "colaborador", active: "proyectos.html", title: "Mis proyectos", subtitle: "3 proyectos actuales · 5 históricos" });
  if (!cfg) return;

  var actuales = [
    { p: MOCK.findProject("Portal Andes"), rol: "Frontend Sr.", dedicacion: 45 },
    { p: MOCK.findProject("App Móvil Aurora"), rol: "Frontend", dedicacion: 35 },
    { p: MOCK.findProject("Núcleo Retail"), rol: "Consultora UI", dedicacion: 0 }
  ];
  var estadoBadge = { "Activo": "badge-green", "En riesgo": "badge-amber", "Planeado": "badge-neutral", "Bloqueado": "badge-red", "Cerrado": "badge-neutral" };

  document.getElementById("tab-actuales").innerHTML = actuales.map(function (row) {
    var p = row.p;
    return '<div class="card card-pad">' +
      '<div style="display:flex; align-items:center; gap:var(--space-3); margin-bottom:var(--space-4);">' +
      '<span class="avatar" style="border-radius:var(--radius-md); background:var(--navy-700);">' + p.iniciales + '</span>' +
      '<div style="flex:1; min-width:0;"><div style="font-weight:600;">' + p.nombre + '</div><div class="text-tertiary" style="font-size:var(--fs-xs);">' + p.cliente + '</div></div>' +
      '<span class="badge ' + (estadoBadge[p.estado] || "badge-neutral") + '">' + p.estado + "</span></div>" +
      '<p class="text-secondary" style="font-size:var(--fs-sm); line-height:1.5; margin-bottom:var(--space-4);">' + p.descripcion.slice(0, 130) + "…</p>" +
      '<div class="progress-inline" style="margin-bottom:var(--space-4);"><div class="progress-bar"><div class="progress-bar-fill" style="width:' + p.avance + '%;"></div></div><span class="progress-value">' + p.avance + '%</span></div>' +
      '<div style="display:flex; justify-content:space-between; align-items:center;">' +
      '<span class="label-mono">' + row.rol + " · " + row.dedicacion + '% dedicación</span>' +
      '<button type="button" class="btn btn-tertiary btn-sm" data-open-detail="' + p.nombre + '">Ver detalle →</button></div>' +
      "</div>";
  }).join("");

  document.getElementById("tab-actuales").querySelectorAll("[data-open-detail]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var p = MOCK.findProject(btn.dataset.openDetail);
      var html = '<div class="modal modal-wide" role="dialog" aria-modal="true">' +
        '<div class="modal-header"><div><h2>' + p.nombre + '</h2><p>' + p.cliente + ' · ' + p.inicio + ' → ' + p.fin + '</p></div>' +
        '<button type="button" class="modal-close" data-modal-close aria-label="Cerrar"><svg class="icon"><use href="/img/icons.svg#icon-x"></use></svg></button></div>' +
        '<div class="modal-body"><p class="text-secondary" style="line-height:1.6; margin-bottom:var(--space-5);">' + p.descripcion + '</p>' +
        '<div style="display:flex; flex-wrap:wrap; gap:var(--space-2);">' + p.stack.map(function (t) { return '<span class="badge badge-neutral">' + t + '</span>'; }).join("") + '</div></div>' +
        '<div class="modal-footer"><button type="button" class="btn btn-secondary" data-modal-close>Cerrar</button></div></div>';
      SBAI.modal.open(html);
    });
  });

  document.getElementById("historial-body").innerHTML = MOCK.marianaHistorial.map(function (h) {
    var badgeCls = { "En curso": "badge-blue", "En riesgo": "badge-amber", "Cerrado": "badge-neutral" }[h.estado] || "badge-neutral";
    return "<tr><td class=\"cell-primary\">" + h.proyecto + "</td><td>" + h.cliente + "</td><td>" + h.rol + "</td><td>" + h.periodo + "</td>" +
      '<td><span class="badge ' + badgeCls + '">' + h.estado + "</span></td></tr>";
  }).join("");

  document.querySelectorAll("[data-tab]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("[data-tab]").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      document.getElementById("tab-actuales").hidden = btn.dataset.tab !== "actuales";
      document.getElementById("tab-historial").hidden = btn.dataset.tab !== "historial";
    });
  });
});
</script>
</body>
</html>
