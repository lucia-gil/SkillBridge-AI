<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes · SkillBridge AI</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>
<script th:inline="javascript">try{sessionStorage.setItem("sbai_active_role", /*[[${rolSlug}]]*/ "colaborador");}catch(e){}</script>

<div class="app-shell">
  <aside class="sidebar" id="sbai-sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="sbai-topbar"></header>
    <main class="page-content" id="page-content">

      <div class="kpi-grid" id="kpi-grid"></div>

      <div class="detail-grid" style="margin-top:var(--space-6);">
        <section class="card card-pad">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--space-5);">
            <div>
              <h2 style="font-size:var(--fs-md);">Evolución de ocupación</h2>
              <p class="text-tertiary" style="font-size:var(--fs-xs); margin-top:2px;" id="evo-subtitle"></p>
            </div>
            <button type="button" class="btn btn-secondary btn-sm" id="export-btn"><svg class="icon icon-sm"><use href="/img/icons.svg#icon-download"></use></svg>Exportar</button>
          </div>
          <div class="bar-chart" id="evo-chart"></div>
        </section>

        <section class="card card-pad">
          <h3 style="font-size:var(--fs-md); margin-bottom:var(--space-4);">Habilidades más demandadas</h3>
          <div id="skills-demand"></div>
        </section>
      </div>

      <section class="card" style="margin-top:var(--space-6);">
        <div class="card-header"><div class="card-header-text"><h2>Ocupación por colaborador</h2><p>Promedio de las últimas 6 semanas</p></div></div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Colaborador</th><th>Cargo</th><th>Ocupación promedio</th><th>Estado</th></tr></thead>
            <tbody id="detail-body"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>
</div>

<script src="/js/mock-data.js"></script>
<script src="/js/state.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/dropdown.js"></script>
<script src="/js/table-filter.js"></script>
<script src="/js/command-palette.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/topbar-actions.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var cfg = SBAI.shell.init({ role: "resource-manager", active: "reportes.html", title: "Reportes", subtitle: "Ocupación y demanda de habilidades · Q3 2026" });
  if (!cfg) return;

  var r = MOCK.rmReport;
  document.getElementById("evo-subtitle").textContent = "Últimos 6 meses · meta " + r.meta + "%";

  document.getElementById("kpi-grid").innerHTML = [
    { label: "OCUPACIÓN PROMEDIO", value: r.ocupacionPromedio + "%", meta: "meta " + r.meta + "%", cls: "warn", color: "blue", icon: "activity" },
    { label: "SOBRE-ASIGNADOS", value: r.sobreAsignados, meta: "requieren acción", cls: "down", color: "red", icon: "alert-triangle" },
    { label: "CAPACIDAD LIBRE", value: r.capacidadLibre + " h", meta: "próximas 6 semanas", color: "green", icon: "check-circle" },
    { label: "SOLICITUDES PENDIENTES", value: r.solicitudesPendientes, meta: r.vencenHoy + " vencen hoy", cls: "warn", color: "amber", icon: "clock" }
  ].map(function (k) { 
    return '<div class="kpi-tile accent-' + k.color + '">' +
      '<div class="kpi-tile-icon ' + k.color + '"><svg class="icon"><use href="/img/icons.svg#icon-' + k.icon + '"></use></svg></div>' +
      '<span class="kpi-tile-label">' + k.label + '</span>' +
      '<span class="kpi-tile-value">' + k.value + '</span>' +
      '<span class="kpi-tile-meta ' + (k.cls || "") + '">' + k.meta + '</span></div>'; 
  }).join("");

  document.getElementById("evo-chart").innerHTML = r.evolucion.map(function (m) {
    return '<div class="bar-chart-col"><span class="bar-chart-value">' + m.pct + '%</span>' +
      '<div class="bar-chart-track"><div class="bar-chart-fill' + (m.pct >= r.meta ? " accent" : "") + '" style="height:' + m.pct + '%;"></div></div>' +
      '<span class="bar-chart-label">' + m.mes + '</span></div>';
  }).join("");

  var maxDemand = Math.max.apply(null, MOCK.skillsDemand.map(function (s) { return s.vacantes; }));
  document.getElementById("skills-demand").innerHTML = MOCK.skillsDemand.map(function (s) {
    return '<div style="margin-bottom:var(--space-3);"><div style="display:flex; justify-content:space-between; font-size:var(--fs-xs); margin-bottom:4px;"><span style="font-weight:500;">' + s.nombre + '</span><span class="text-tertiary mono">' + s.vacantes + ' vacantes</span></div>' +
      '<div class="progress-bar"><div class="progress-bar-fill" style="width:' + Math.round((s.vacantes / maxDemand) * 100) + '%;"></div></div></div>';
  }).join("");

  function estadoInfo(v) {
    if (v > 100) return { badge: "badge-red", label: "Sobre-asignado" };
    if (v >= 90) return { badge: "badge-amber", label: "Al límite" };
    if (v >= 60) return { badge: "badge-green", label: "Óptimo" };
    return { badge: "badge-neutral", label: "Subutilizado" };
  }

  document.getElementById("detail-body").innerHTML = r.ocupacionPorColaborador.map(function (o) {
    var ei = estadoInfo(o.promedio);
    return '<tr><td class="cell-person"><span class="avatar avatar-sm">' + o.iniciales + '</span><span class="cell-person-name">' + o.nombre + '</span></td>' +
      "<td>" + o.cargo + '</td><td class="mono">' + o.promedio + '%</td><td><span class="badge ' + ei.badge + '">' + ei.label + "</span></td></tr>";
  }).join("");

  document.getElementById("export-btn").addEventListener("click", function () {
    SBAI.toast.show("Generando exportable de reportes en PDF…");
  });
});
</script>
</body>
</html>
