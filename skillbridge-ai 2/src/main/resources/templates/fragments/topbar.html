<!DOCTYPE html>
<!--
  fragments/topbar.html — Referencia 1:1 del topbar generado hoy por
  static/js/shell.js (función topbarHtml). Modelo esperado del
  controlador: "title", "subtitle", "unreadCount", "notifications"
  (últimas 4, tipo List<NotificacionFila> - ver ShellModelBuilder, que las
  arma desde NotificacionService/tabla real "notificaciones"), "user". Ver
  fragments/sidebar.html para el porqué de que hoy viva en JS en vez de vía
  fetch().
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header class="topbar" th:fragment="topbar">
  <div class="topbar-heading">
    <span class="topbar-title" th:text="${title}">Título</span>
    <!-- Siempre se renderiza, incluso vacío: varias vistas (p. ej.
         notificaciones.html) fijan el subtítulo por JS después de cargar
         el shell, y necesitan el <span> presente en el DOM desde el
         inicio. Antes tenía th:if="${subtitle}", lo que rompía esas
         vistas cuando el controlador no enviaba subtítulo. -->
    <span class="topbar-subtitle" th:text="${subtitle} ?: ''">Subtítulo</span>
  </div>

  <button type="button" class="topbar-search" data-open-command-palette>
    <svg class="icon"><use href="/img/icons.svg#icon-search"></use></svg>
    <span>Buscar colaboradores, proyectos o habilidades…</span>
    <kbd>⌘K</kbd>
  </button>

  <div class="topbar-actions">
    <a class="topbar-ai-btn" href="asistente-ia.html">
      <svg class="icon"><use href="/img/icons.svg#icon-sparkles"></use></svg>
      <span>Asistente IA</span>
    </a>

    <div class="dropdown">
      <button type="button" class="topbar-icon-btn" data-dropdown-trigger="notif-panel" aria-label="Notificaciones">
        <svg class="icon"><use href="/img/icons.svg#icon-bell"></use></svg>
        <span class="counter-badge" th:if="${unreadCount > 0}" th:text="${unreadCount}">0</span>
      </button>
      <div class="dropdown-panel notif-panel align-right" data-dropdown-panel="notif-panel">
        <div class="notif-panel-header">
          <h3>Notificaciones</h3>
          <button type="button" class="btn btn-tertiary btn-sm" data-action="mark-all-read-quick">Marcar leídas</button>
        </div>
        <div class="notif-panel-list">
          <!-- th:each="n : ${notifications}" (List<NotificacionFila>) -->
          <div class="notif-item" th:classappend="${n.leida} ? '' : 'unread'" th:each="n : ${notifications}">
            <span class="notif-item-icon" th:classappend="${n.iconClass}">
              <svg class="icon icon-sm"><use th:attr="href='/img/icons.svg#' + ${n.iconId}"></use></svg>
            </span>
            <span class="notif-item-body">
              <span class="notif-item-title" th:text="${n.titulo}">Título</span>
              <span class="notif-item-desc" th:text="${n.detalle}">Descripción</span>
              <span class="notif-item-time" th:text="${n.fechaLabel}">00:00</span>
            </span>
          </div>
        </div>
        <div class="notif-panel-footer"><a href="notificaciones.html">Ver todas las notificaciones →</a></div>
      </div>
    </div>

    <div class="dropdown">
      <button type="button" class="topbar-user-btn" data-dropdown-trigger="user-menu-topbar">
        <span class="avatar avatar-sm" th:text="${user.iniciales}">MR</span>
        <svg class="icon icon-sm"><use href="/img/icons.svg#icon-chevron-down"></use></svg>
      </button>
      <div th:replace="~{fragments/modals :: user-menu('user-menu-topbar', 'align-right')}"></div>
    </div>
  </div>
</header>
</body>
</html>
