<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foros · SkillBridge AI</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>
<script th:inline="javascript">try{sessionStorage.setItem("sbai_active_role", /*[[${rolSlug}]]*/ "colaborador");}catch(e){}</script>

<div class="app-shell">
  <aside class="sidebar" id="sbai-sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="sbai-topbar"></header>
    <main class="page-content" id="page-content">

      <div class="detail-grid">
        <section class="card">
          <div class="table-toolbar">
            <div class="tabs" id="pm-forum-tabs">
              <button type="button" class="tab-btn active" data-scope="mios">De mis proyectos</button>
              <button type="button" class="tab-btn" data-scope="todos">Todos</button>
              <button type="button" class="tab-btn" data-scope="sinresponder">Sin responder</button>
              <button type="button" class="tab-btn" data-scope="conresumen">Con resumen IA</button>
            </div>
            <button type="button" class="btn btn-primary btn-sm" id="new-thread-btn"><svg class="icon icon-sm"><use href="/img/icons.svg#icon-plus"></use></svg>Nuevo hilo</button>
          </div>
          <div id="thread-list"></div>
        </section>

        <div style="display:flex; flex-direction:column; gap:var(--space-5);">
          <section class="callout ai">
            <span class="callout-icon"><svg class="icon"><use href="/img/icons.svg#icon-sparkles"></use></svg></span>
            <span class="callout-body"><span class="callout-title">Qué discute tu equipo</span>
            Esta semana los hilos de tus proyectos giran en torno a la migración a Java 21 y a los Helm charts compartidos. Dos decisiones técnicas pendientes podrían afectar el cronograma de Núcleo Retail.
            <div class="text-tertiary" style="font-size:10px; margin-top:6px; font-family:var(--font-mono);">RESUMEN SEMANAL GENERADO POR IA</div></span>
          </section>

          <section class="card card-pad">
            <p class="label-mono" style="margin-bottom:var(--space-3);">Actividad por proyecto</p>
            <div id="activity-by-project"></div>
          </section>

          <section class="card card-pad">
            <p class="label-mono" style="margin-bottom:var(--space-3);">Requiere tu respuesta</p>
            <div id="needs-reply"></div>
          </section>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="/js/mock-data.js"></script>
<script src="/js/state.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/dropdown.js"></script>
<script src="/js/table-filter.js"></script>
<script src="/js/command-palette.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/shell.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var cfg = SBAI.shell.init({ role: "project-manager", active: "foros.html", title: "Foros", subtitle: "Filtrado por mis proyectos · 62 hilos" });
  if (!cfg) return;

  var pmProjects = ["Portal Andes", "App Móvil Aurora", "Núcleo Retail", "Motor Cobranzas v2"];
  var activeScope = "mios";

  function render() {
    var list = MOCK.forumThreads.slice();
    if (activeScope === "mios") list = list.filter(function (t) { return t.proyecto && pmProjects.indexOf(t.proyecto) !== -1; });
    if (activeScope === "sinresponder") list = list.filter(function (t) { return t.respuestas === 0; });
    if (activeScope === "conresumen") list = list.filter(function (t) { return !!t.resumenIA; });

    document.getElementById("thread-list").innerHTML = list.map(function (t) {
      var ai = t.resumenIA ? '<div class="thread-row-ai"><svg class="icon icon-sm"><use href="/img/icons.svg#icon-sparkles"></use></svg><span>' + t.resumenIA.slice(0, 140) + '…</span></div>' : "";
      return '<div class="thread-row" data-open-thread="' + t.id + '"><span class="avatar avatar-sm">' + t.iniciales + '</span>' +
        '<div class="thread-row-body"><div class="thread-row-title">' + (t.fijado ? '<span class="badge badge-blue">FIJADO</span>' : "") + t.titulo + '</div>' +
        '<div class="thread-row-meta">' + t.categoria + " · " + t.autor + " · " + t.tiempo + " · " + t.vistas + ' vistas' + (t.proyecto ? " · " + t.proyecto : "") + '</div>' + ai + "</div>" +
        '<div class="thread-row-count"><div class="thread-row-count-num">' + t.respuestas + '</div><div class="thread-row-count-label">Respuestas</div></div></div>';
    }).join("") || '<div class="state-panel"><span class="state-panel-icon"><svg class="icon"><use href="/img/icons.svg#icon-message"></use></svg></span><span class="state-panel-title">Sin hilos en esta vista</span></div>';

    document.querySelectorAll("[data-open-thread]").forEach(function (row) { row.addEventListener("click", function () { window.location.href = "foro-hilo.html"; }); });
  }

  document.querySelectorAll("#pm-forum-tabs [data-scope]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("#pm-forum-tabs [data-scope]").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      activeScope = btn.dataset.scope;
      render();
    });
  });

  document.getElementById("activity-by-project").innerHTML = MOCK.threadActivityByProject.map(function (a) {
    return '<div class="info-row"><span class="info-row-label">' + a.proyecto + '</span><span class="info-row-value">' + a.hilos + " hilos</span></div>";
  }).join("");

  document.getElementById("needs-reply").innerHTML = MOCK.threadsNeedingReply.map(function (r) {
    return '<a href="foro-hilo.html" style="display:block; color:inherit; padding:var(--space-2) 0; border-bottom:1px solid var(--border-subtle);">' +
      '<div style="font-size:var(--fs-xs); font-weight:500;">' + r.titulo + '</div><div class="text-tertiary" style="font-size:10px; margin-top:2px;">' + r.autor + " · " + r.tiempo + "</div></a>";
  }).join("");

  document.getElementById("new-thread-btn").addEventListener("click", function () {
    SBAI.toast.show("Usa “Nuevo hilo” desde la vista de Colaborador — aquí puedes moderar y responder los hilos de tu equipo.");
  });

  render();
});
</script>
</body>
</html>
