<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes globales · SkillBridge AI</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>
<script th:inline="javascript">try{sessionStorage.setItem("sbai_active_role", /*[[${rolSlug}]]*/ "colaborador");}catch(e){}</script>

<div class="app-shell">
  <aside class="sidebar" id="sbai-sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="sbai-topbar"></header>
    <main class="page-content" id="page-content">

      <div class="kpi-grid" id="kpi-grid"></div>

      <div class="detail-grid" style="margin-top:var(--space-6);">
        <section class="card card-pad">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--space-5);">
            <div>
              <h2 style="font-size:var(--fs-md);">Vacantes por habilidad</h2>
              <p class="text-tertiary" style="font-size:var(--fs-xs); margin-top:2px;">Brechas abiertas en toda la organización</p>
            </div>
            <button type="button" class="btn btn-secondary btn-sm" id="export-btn"><svg class="icon icon-sm"><use href="/img/icons.svg#icon-download"></use></svg>Exportar</button>
          </div>
          <div id="skills-demand"></div>
        </section>

        <section class="card card-pad">
          <h3 style="font-size:var(--fs-md); margin-bottom:var(--space-4);">Proyectos por estado</h3>
          <div id="project-status"></div>
        </section>
      </div>

      <section class="card card-pad" style="margin-top:var(--space-6);">
        <h3 style="font-size:var(--fs-md); margin-bottom:var(--space-4);">Ocupación por colaborador</h3>
        <div id="team-occupancy"></div>
      </section>

    </main>
  </div>
</div>

<script src="/js/mock-data.js"></script>
<script src="/js/state.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/dropdown.js"></script>
<script src="/js/table-filter.js"></script>
<script src="/js/command-palette.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/shell.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var cfg = SBAI.shell.init({ role: "administrador", active: "reportes.html", title: "Reportes globales", subtitle: "Vista consolidada de toda la plataforma · Q3 2026" });
  if (!cfg) return;

  var r = MOCK.adminReport;
  document.getElementById("kpi-grid").innerHTML = [
    { label: "COLABORADORES ACTIVOS", value: r.colaboradoresActivos, meta: "+" + r.colaboradoresDelta + " este mes", cls: "up" },
    { label: "PROYECTOS EN CURSO", value: r.proyectosEnCurso, meta: r.proyectosCierranSep + " cierran en septiembre" },
    { label: "HABILIDADES EN CATÁLOGO", value: r.habilidadesCatalogo, meta: r.habilidadesSinAsignar + " sin proyecto asociado", cls: "warn" },
    { label: "CONSULTAS AL ASISTENTE IA", value: r.consultasIA.toLocaleString("es-CO"), meta: "+" + r.consultasDelta + "% vs. semana anterior", cls: "up" }
  ].map(function (k) { return '<div class="kpi-tile"><span class="kpi-tile-label">' + k.label + '</span><span class="kpi-tile-value">' + k.value + '</span><span class="kpi-tile-meta ' + (k.cls || "") + '">' + k.meta + '</span></div>'; }).join("");

  var maxDemand = Math.max.apply(null, r.vacantesPorHabilidad.map(function (s) { return s.vacantes; }));
  document.getElementById("skills-demand").innerHTML = r.vacantesPorHabilidad.map(function (s) {
    return '<div style="margin-bottom:var(--space-3);"><div style="display:flex; justify-content:space-between; font-size:var(--fs-xs); margin-bottom:4px;"><span style="font-weight:500;">' + s.nombre + '</span><span class="text-tertiary mono">' + s.vacantes + ' vacantes</span></div>' +
      '<div class="progress-bar"><div class="progress-bar-fill" style="width:' + Math.round((s.vacantes / maxDemand) * 100) + '%;"></div></div></div>';
  }).join("");

  var estados = {};
  MOCK.projects.forEach(function (p) { estados[p.estado] = (estados[p.estado] || 0) + 1; });
  var estadoBadge = { "Activo": "badge-green", "En riesgo": "badge-amber", "Planeado": "badge-neutral", "Bloqueado": "badge-red", "Cerrado": "badge-neutral" };
  document.getElementById("project-status").innerHTML = Object.keys(estados).map(function (e) {
    return '<div class="info-row"><span class="info-row-label"><span class="badge ' + (estadoBadge[e] || "badge-neutral") + '">' + e + '</span></span><span class="info-row-value mono">' + estados[e] + ' proyecto' + (estados[e] === 1 ? "" : "s") + '</span></div>';
  }).join("");

  function estadoInfo(v) {
    if (v > 100) return { badge: "badge-red", label: "Sobre-asignado" };
    if (v >= 90) return { badge: "badge-amber", label: "Al límite" };
    if (v >= 60) return { badge: "badge-green", label: "Óptimo" };
    return { badge: "badge-neutral", label: "Subutilizado" };
  }
  document.getElementById("team-occupancy").innerHTML = '<div class="table-scroll"><table class="data-table"><thead><tr><th>Colaborador</th><th>Cargo</th><th>Ocupación promedio</th><th>Estado</th></tr></thead><tbody>' +
    MOCK.rmReport.ocupacionPorColaborador.map(function (o) {
      var ei = estadoInfo(o.promedio);
      return '<tr><td class="cell-person"><span class="avatar avatar-sm">' + o.iniciales + '</span><span class="cell-person-name">' + o.nombre + '</span></td>' +
        "<td>" + o.cargo + '</td><td class="mono">' + o.promedio + '%</td><td><span class="badge ' + ei.badge + '">' + ei.label + "</span></td></tr>";
    }).join("") + '</tbody></table></div>';

  document.getElementById("export-btn").addEventListener("click", function () {
    SBAI.toast.show("Generando exportable de reportes globales en PDF…");
  });
});
</script>
</body>
</html>
