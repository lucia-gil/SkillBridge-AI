<!DOCTYPE html>
<!--
  fragments/topbar.html
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header class="topbar" th:fragment="topbar">

  <div class="topbar-heading">
    <span
            class="topbar-title"
            th:text="${title}">
      Título
    </span>

    <span
            class="topbar-subtitle"
            th:text="${subtitle} ?: ''">
      Subtítulo
    </span>
  </div>


  <!-- BUSCADOR -->

  <button
          type="button"
          class="topbar-search"
          data-open-command-palette>

    <svg class="icon">
      <use href="/img/icons.svg#icon-search"></use>
    </svg>

    <span>
      Buscar colaboradores, proyectos o habilidades…
    </span>

    <kbd>⌘K</kbd>

  </button>


  <!-- ACCIONES -->

  <div class="topbar-actions">


    <!-- ASISTENTE IA -->

    <a
            class="topbar-ai-btn"
            href="asistente-ia.html">

      <svg class="icon">
        <use href="/img/icons.svg#icon-sparkles"></use>
      </svg>

      <span>
        Asistente IA
      </span>

    </a>


    <!-- NOTIFICACIONES -->

    <div class="dropdown">

      <button
              type="button"
              class="topbar-icon-btn"
              data-dropdown-trigger="notif-panel"
              aria-label="Notificaciones">

        <svg class="icon">
          <use href="/img/icons.svg#icon-bell"></use>
        </svg>

        <span
                class="counter-badge"
                th:if="${unreadCount > 0}"
                th:text="${unreadCount}">
          0
        </span>

      </button>


      <div
              class="dropdown-panel notif-panel align-right"
              data-dropdown-panel="notif-panel">

        <div class="notif-panel-header">

          <h3>
            Notificaciones
          </h3>

          <button
                  type="button"
                  class="btn btn-tertiary btn-sm"
                  data-action="mark-all-read-quick">

            Marcar leídas

          </button>

        </div>


        <div class="notif-panel-list">

          <div
                  class="notif-item"
                  th:classappend="${n.leida} ? '' : 'unread'"
                  th:each="n : ${notifications}">

            <span
                    class="notif-item-icon"
                    th:classappend="${n.iconClass}">

              <svg class="icon icon-sm">

                <use th:href="@{'/img/icons.svg#' + ${n.iconId}}"></use>

              </svg>

            </span>


            <span class="notif-item-body">

              <span
                      class="notif-item-title"
                      th:text="${n.titulo}">
                Título
              </span>

              <span
                      class="notif-item-desc"
                      th:text="${n.detalle}">
                Descripción
              </span>

              <span
                      class="notif-item-time"
                      th:text="${n.fechaLabel}">
                00:00
              </span>

            </span>

          </div>

        </div>


        <div class="notif-panel-footer">

          <a href="notificaciones.html">
            Ver todas las notificaciones →
          </a>

        </div>

      </div>

    </div>


    <!-- USUARIO -->

    <div class="dropdown">

      <button
              type="button"
              class="topbar-user-btn"
              data-dropdown-trigger="user-menu-topbar"
              aria-label="Menú de usuario">


        <!-- FOTO -->

        <span class="topbar-user-avatar">

          <img
                  th:if="${user.tieneFoto}"
                  th:src="@{/perfil/foto}"
                  th:alt="${user.nombre}"
                  class="topbar-user-photo">


          <!-- FALLBACK: INICIALES -->

          <span
                  th:unless="${user.tieneFoto}"
                  class="avatar avatar-sm"
                  th:text="${user.iniciales}">
            LG
          </span>

        </span>


        <!-- NOMBRE -->

        <span
                class="topbar-user-name"
                th:text="${user.nombre}">
          Nombre
        </span>


        <!-- FLECHA -->

        <svg class="icon icon-sm">
          <use href="/img/icons.svg#icon-chevron-down"></use>
        </svg>

      </button>


      <!-- MENÚ EXISTENTE -->

      <div
              th:replace="~{fragments/modals :: user-menu('user-menu-topbar', 'align-right')}">
      </div>

    </div>

  </div>

</header>

</body>
</html>
