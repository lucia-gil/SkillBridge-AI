<!DOCTYPE html>
<!--
  fragments/modals.html — Referencia Thymeleaf de los modales que hoy
  arma static/js/modal.js en memoria (openRolePicker, confirm, y el menú
  de usuario que reutilizan sidebar.html/topbar.html). Se documentan
  aquí para la migración; la demo estática los sigue generando por JS
  porque su contenido depende de la interacción (rol elegido, fila de
  tabla clicada, etc.), no de datos que el servidor conozca de antemano.
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>


<!-- Menú de usuario compartido por sidebar y topbar. "align" agrega
     align-right cuando el disparador está pegado al borde derecho
     (topbar); el panel del sidebar además debe abrir hacia ARRIBA
     porque su botón vive al fondo de la pantalla — de ahí el estilo
     inline condicional por id. Ambos casos se resuelven una sola vez
     acá en vez de duplicar el fragmento. -->
<div class="dropdown-panel dropdown-menu" th:fragment="user-menu(id, align)"
     th:classappend="${align == 'align-right'} ? 'align-right' : ''"
     th:attr="data-dropdown-panel=${id}, style=${id == 'user-menu-sidebar'} ? 'bottom: calc(100% + 8px); top: auto;' : null">
  <a class="dropdown-item" href="mi-cuenta.html">
    <svg class="icon"><use href="/img/icons.svg#icon-user"></use></svg>Mi cuenta
  </a>
  <a class="dropdown-item" href="mi-cuenta.html">
    <svg class="icon"><use href="/img/icons.svg#icon-settings"></use></svg>Configuración
  </a>
  <div class="dropdown-divider"></div>
  <button type="button" class="dropdown-item danger" data-action="logout">
    <svg class="icon"><use href="/img/icons.svg#icon-log-out"></use></svg>Cerrar sesión
  </button>
</div>

<!-- Popup de selección de rol (login, fin de registro, fin de recuperar contraseña) -->
<div class="modal-backdrop" th:fragment="role-picker">
  <div class="modal modal-wide" role="dialog" aria-modal="true">
    <div class="modal-header">
      <div>
        <h2>¿Con qué rol quieres entrar?</h2>
        <p>Esta demo aún no verifica credenciales — elige el rol para continuar con su usuario de referencia.</p>
      </div>
      <button type="button" class="modal-close" data-modal-close aria-label="Cerrar">
        <svg class="icon"><use href="/img/icons.svg#icon-x"></use></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="role-grid">
        <!-- th:each="r : ${roles}" -->
        <button type="button" class="role-card" th:each="r : ${roles}" th:attr="data-role-slug=${r.slug}">
          <span class="role-card-icon"><svg class="icon icon-lg"><use th:attr="href='/img/icons.svg#' + ${r.icon}"></use></svg></span>
          <span class="role-card-title" th:text="${r.title}">Rol</span>
          <span class="role-card-desc" th:text="${r.desc}">Descripción</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal de confirmación genérico (Suspender, Liberar, Rebalancear, Aprobar excepción...) -->
<div class="modal-backdrop" th:fragment="confirm(title, desc, confirmLabel, variant)">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <div><h2 th:text="${title}">Título</h2><p th:if="${desc}" th:text="${desc}">Descripción</p></div>
      <button type="button" class="modal-close" data-modal-close aria-label="Cerrar">
        <svg class="icon"><use href="/img/icons.svg#icon-x"></use></svg>
      </button>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button>
      <button type="button" class="btn btn-primary" th:classappend="${variant == 'destructive'} ? 'btn-destructive-solid' : 'btn-primary'"
              data-confirm-action th:text="${confirmLabel}">Confirmar</button>
    </div>
  </div>
</div>

</body>
</html>
