<!DOCTYPE html>
<!--
    fragments/sidebar.html — Sidebar principal de SkillBridge AI.
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="sidebar" th:fragment="sidebar">

    <!-- LOGO -->
    <div class="sidebar-brand">
        <img
                src="/img/logo_blanco.png"
                alt="SkillBridge AI"
                class="sidebar-logo"
        >
    </div>

    <!-- ROL -->
    <div class="sidebar-role-badge" th:text="${roleLabel}">
        ROL
    </div>

    <!-- NAVEGACIÓN -->
    <nav class="sidebar-nav" aria-label="Navegación principal">

        <a
                class="sidebar-nav-item"
                th:classappend="${item.href == activeHref} ? 'active'"
                th:href="${item.href}"
                th:each="item : ${navItems}"
        >
            <svg class="icon">
                <use th:href="@{'/img/icons.svg#' + ${item.icon}}"></use>
            </svg>

            <span
                    class="sidebar-nav-item-label"
                    th:text="${item.label}"
            >
                Label
            </span>

            <span
                    class="counter-badge"
                    th:if="${item.badge != null and item.badge > 0}"
                    th:text="${item.badge}"
            >
                0
            </span>
        </a>

    </nav>

</aside>

</body>
</html>
