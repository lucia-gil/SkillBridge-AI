<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente IA · SkillBridge AI</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>
<script th:inline="javascript">try{sessionStorage.setItem("sbai_active_role", /*[[${rolSlug}]]*/ "colaborador");}catch(e){}</script>

<div class="app-shell">
  <aside class="sidebar" id="sbai-sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="sbai-topbar"></header>
    <main class="page-content page-content-wide" id="page-content">

      <div class="chat-layout">
        <div style="display:flex; flex-direction:column; gap:var(--space-4);">
          <button type="button" class="btn btn-secondary btn-block" id="new-convo-btn">
            <svg class="icon icon-sm"><use href="/img/icons.svg#icon-plus"></use></svg>Nueva conversación</button>
          <div>
            <p class="label-mono" style="margin-bottom:var(--space-2); padding:0 var(--space-2);">Historial</p>
            <div id="chat-history"></div>
          </div>
        </div>

        <section class="card chat-window">
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-suggestions" id="chat-suggestions"></div>
          <div class="chat-composer">
            <input type="text" class="input" id="chat-input" placeholder="Pregunta sobre ocupación, capacidad libre o brechas de habilidades…">
            <button type="button" class="chat-composer-send" id="chat-send" disabled><svg class="icon"><use href="/img/icons.svg#icon-arrow-up"></use></svg></button>
          </div>
          <p class="chat-disclaimer">Como Resource Manager, el asistente consulta la ocupación y disponibilidad de los 184 colaboradores.</p>
        </section>

        <div style="display:flex; flex-direction:column; gap:var(--space-4);">
          <p class="label-mono">Contexto cargado</p>
          <div class="ai-context-card"><div class="ai-context-card-title">184 perfiles</div><div class="ai-context-card-sub">Ocupación de las últimas 8 semanas</div></div>
          <div class="ai-context-card"><div class="ai-context-card-title">312 habilidades</div><div class="ai-context-card-sub">Catálogo completo y demanda</div></div>
          <div class="ai-context-card"><div class="ai-context-card-title">Solicitudes pendientes</div><div class="ai-context-card-sub">4 excepciones de carga por revisar</div></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="/js/mock-data.js"></script>
<script src="/js/state.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/dropdown.js"></script>
<script src="/js/table-filter.js"></script>
<script src="/js/command-palette.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/ai-assistant.js"></script>
<script src="/js/shell.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var cfg = SBAI.shell.init({ role: "resource-manager", active: "asistente-ia.html", title: "Asistente IA", subtitle: "Contexto: ocupación, capacidad y habilidades del equipo" });
  if (!cfg) return;

  SBAI.ai.renderHistory("resource-manager", document.getElementById("chat-history"));
  var messagesEl = document.getElementById("chat-messages");
  SBAI.ai.renderConversation("resource-manager", messagesEl);

  var suggestions = MOCK.aiSuggestions.rm;
  document.getElementById("chat-suggestions").innerHTML = suggestions.map(function (s) { return '<button type="button" class="chat-suggestion-chip" data-ai-suggestion>' + s + "</button>"; }).join("");

  var input = document.getElementById("chat-input"), sendBtn = document.getElementById("chat-send");
  SBAI.ai.wireComposer("resource-manager", { input: input, sendBtn: sendBtn, messagesEl: messagesEl });
  SBAI.ai.wireSuggestionChips("resource-manager", document.getElementById("chat-suggestions"), function (text) {
    input.value = text; sendBtn.disabled = false;
    SBAI.ai.sendMessage("resource-manager", text, messagesEl);
    input.value = ""; sendBtn.disabled = true;
  });

  document.getElementById("new-convo-btn").addEventListener("click", function () {
    messagesEl.innerHTML = '<div class="chat-date-sep">' + MOCK.meta.todayLabel.toUpperCase() + '</div>' +
      '<div class="chat-msg assistant"><div class="chat-bubble">Hola de nuevo, Paula. ¿Sobre qué quieres que te ayude: ocupación, capacidad libre o brechas de habilidades?</div><div class="chat-meta">ASISTENTE SKILLBRIDGE</div></div>';
    SBAI.toast.show("Nueva conversación iniciada.");
  });
});
</script>
</body>
</html>
