# =====================================================================
# SkillBridge AI - configuracion Spring Boot
# =====================================================================

spring.application.name=skillbridge-ai
server.port=8080

# ---------------------------------------------------------------------
# Secretos FUERA de este archivo (no deben subirse a GitHub ni ir en un zip).
# Se leen, en este orden de prioridad:
#   1) variables de entorno DB_PASSWORD / MAIL_PASSWORD (recomendado en el EC2),
#   2) src/main/resources/secretos.properties (local; esta en .gitignore).
# Plantilla: secretos.properties.example
# ---------------------------------------------------------------------
spring.config.import=optional:classpath:secretos.properties

# Clave de la API de Claude/Anthropic (Asistente IA). Igual patron que
# MAIL_PASSWORD: viene de secretos.properties (local) o de la variable de
# entorno ANTHROPIC_API_KEY (recomendado en el EC2).
anthropic.api.key=${ANTHROPIC_API_KEY:}
# Modelos de Claude que se prueban en orden (si uno falla, se usa el siguiente).
claude.modelos=${CLAUDE_MODELOS:claude-sonnet-5}
# Proveedor de respaldo opcional (cualquier API compatible con OpenAI:
# Groq, OpenRouter, Mistral...). Solo se usa si hay IA_RESPALDO_API_KEY.
ia.respaldo.url=${IA_RESPALDO_URL:https://api.groq.com/openai/v1/chat/completions}
ia.respaldo.modelo=${IA_RESPALDO_MODELO:llama-3.3-70b-versatile}
ia.respaldo.api-key=${IA_RESPALDO_API_KEY:}

# URL publica base de la app (links de los correos). IP elastica de EC2; se puede cambiar con APP_BASE_URL.
app.base-url=${APP_BASE_URL:http://13.216.85.235:8080}

# ---------------------------------------------------------------------
# Base de datos MySQL local
# Ajusta usuario/clave/puerto a tu instalacion local. El esquema
# (tablas + datos semilla) se crea ejecutando skillbridge_db.sql
# directamente en MySQL ANTES de levantar la aplicacion: ddl-auto=none
# porque la base de datos ya existe y esta app no debe modificarla.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/skillbridge_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
# Usuario/clave: variables DB_USERNAME / DB_PASSWORD (entorno o secretos.properties).
# Si no se definen: root / sin clave.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hora de Perú también dentro de MySQL (NOW(), CURRENT_TIMESTAMP de las
# columnas fecha_creacion, etc.), aunque el servidor de BD esté en UTC como
# en RDS. Se usa el desfase '-05:00' (Perú no tiene horario de verano)
# porque funciona aunque MySQL no tenga cargadas las tablas de zonas horarias.
# Junto con serverTimezone=America/Lima de la URL y la zona de la JVM
# (SkillbridgeAiApplication), las fechas se guardan tal cual se escriben.
spring.datasource.hikari.connection-init-sql=SET time_zone = '-05:00'

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# En false: Hibernate no debe intentar generar/alterar el esquema, solo
# mapear sobre el que ya crea skillbridge_db.sql.
spring.jpa.show-sql=false

# ---------------------------------------------------------------------
# Thymeleaf: cache desactivado en desarrollo para ver cambios de
# plantilla sin reiniciar. Poner en true para produccion.
# ---------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Sesion HTTP: expiracion de inactividad (coincide con
# configuracion_global.expiracion_sesion_minutos=45 del seed de la BD).
server.servlet.session.timeout=45m

# ---------------------------------------------------------------------
# Spring Session JDBC (Clase 6.2): la sesion vive en MySQL, en las tablas
# SPRING_SESSION y SPRING_SESSION_ATTRIBUTES. "always" las crea al arrancar
# si no existen (tambien se pueden crear a mano: db/skillbridge_db.sql).
# En Spring Boot 3 ya no hace falta spring.session.store-type=jdbc: basta con
# tener spring-session-jdbc en el pom.
# ---------------------------------------------------------------------
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.table-name=SPRING_SESSION
spring.session.timeout=45m

# Cookie de sesion: inaccesible desde JavaScript (robo por XSS) y no se envia
# en peticiones POST desde otros sitios (CSRF). Al tener HTTPS, activar secure.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# server.servlet.session.cookie.secure=true

# Paginas de error: nunca mostrar trazas ni mensajes internos al usuario.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Tamano maximo de archivo de log opcional (no usado por ahora, placeholder)
logging.level.com.skillbridge.ai=INFO

# ---------------------------------------------------------------------
# Fotografias de perfil
# ---------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------------------------------------------------------------------
# Envio de correo (notificaciones reales). Cuenta Gmail con verificacion
# en dos pasos activada + contraseña de aplicacion (NO la contraseña
# normal de la cuenta - Gmail la rechaza para SMTP de apps externas).
# ---------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:claninventorygrupo4@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Agente con herramientas y confirmación explícita de escrituras.
agente.enabled=${AGENTE_ENABLED:true}
agente.solicitudes-minuto=${AGENTE_SOLICITUDES_MINUTO:8}

# Resumen semanal por correo (ResumenSemanalService): cada lunes a las 8:00
# de Perú. Formato cron de Spring: segundo minuto hora día mes día-semana.
resumen.semanal.habilitado=${RESUMEN_SEMANAL_HABILITADO:true}
resumen.semanal.cron=${RESUMEN_SEMANAL_CRON:0 0 8 * * MON}

# Consulta Perú se usa solo en el servidor. Configura el token en el entorno de despliegue.
app.registro.consulta-peru-api-key=${CONSULTA_PERU_API_KEY:}
# Clave persistente de identidad y firma de invitaciones, independiente del token del proveedor.
app.registro.identidad-clave=${IDENTIDAD_DNI_CLAVE:}
