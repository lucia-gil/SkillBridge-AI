# =====================================================================
# SkillBridge AI - configuracion Spring Boot
# =====================================================================

spring.application.name=skillbridge-ai
server.port=8080

# URL publica base de la app (para armar links absolutos en correos, ej. invitacion).
app.base-url=http://3.231.87.24:8080

# ---------------------------------------------------------------------
# Base de datos MySQL local
# Ajusta usuario/clave/puerto a tu instalacion local. El esquema
# (tablas + datos semilla) se crea ejecutando skillbridge_db_v4.sql
# directamente en MySQL ANTES de levantar la aplicacion: ddl-auto=none
# porque la base de datos ya existe y esta app no debe modificarla.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/skillbridge_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=lucia1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# En false: Hibernate no debe intentar generar/alterar el esquema, solo
# mapear sobre el que ya crea skillbridge_db_v4.sql.
spring.jpa.show-sql=false

# ---------------------------------------------------------------------
# Thymeleaf: cache desactivado en desarrollo para ver cambios de
# plantilla sin reiniciar. Poner en true para produccion.
# ---------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Sesion HTTP: expiracion de inactividad (coincide con
# configuracion_global.expiracion_sesion_minutos=45 del seed de la BD).
server.servlet.session.timeout=45m

# Tamano maximo de archivo de log opcional (no usado por ahora, placeholder)
logging.level.com.skillbridge.ai=INFO

spring.servlet.multipart.max-file-size
# ---------------------------------------------------------------------
# Fotografias de perfil
# ---------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------------------------------------------------------------------
# Envio de correo (notificaciones reales). Cuenta Gmail con verificacion
# en dos pasos activada + contraseña de aplicacion (NO la contraseña
# normal de la cuenta - Gmail la rechaza para SMTP de apps externas).
# ---------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=claninventorygrupo4@gmail.com
spring.mail.password=btcunyzawpytsiwf
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
