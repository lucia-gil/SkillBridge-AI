# Caddy termina TLS en el mismo servidor. Tomcat escucha en la interfaz local.
server.address=127.0.0.1
server.forward-headers-strategy=native
server.tomcat.redirect-context-root=false
server.tomcat.remoteip.internal-proxies=127[.]0[.]0[.]1
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.servlet.session.cookie.secure=true
spring.thymeleaf.cache=true
app.base-url=${APP_BASE_URL}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.session.jdbc.initialize-schema=never
# Aplicar db/agente.sql y db/asistente-organizacion.sql de src/main/resources con una cuenta de migración.
agente.init-schema=false
