<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis proyectos · SkillBridge AI</title>
<link rel="stylesheet" href="../../static/css/tokens.css">
<link rel="stylesheet" href="../../static/css/base.css">
<link rel="stylesheet" href="../../static/css/components.css">
<link rel="stylesheet" href="../../static/css/layout.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sbai-sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="sbai-topbar"></header>
    <main class="page-content" id="page-content">

      <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="actuales">Proyectos actuales</button>
        <button type="button" class="tab-btn" data-tab="historial">Historial completo</button>
      </div>

      <div id="proyectos-toolbar" class="card table-filters" style="margin:var(--space-5) 0; padding:var(--space-4) var(--space-5);">
        <div class="input-wrap" style="flex:1; min-width:240px; max-width:360px;">
          <svg class="icon"><use href="../../static/img/icons.svg#icon-search"></use></svg>
          <input type="text" class="input has-left-icon" id="proyectos-search" placeholder="Buscar proyecto por nombre…">
        </div>
        <select class="select" id="proyectos-estado-filter" style="max-width:200px;">
          <option value="todos">Todos los estados</option>
          <option value="Activo">Activo</option>
          <option value="En riesgo">En riesgo</option>
          <option value="Planeado">Planeado</option>
          <option value="Bloqueado">Bloqueado</option>
          <option value="Cerrado">Cerrado</option>
        </select>
      </div>

      <div id="tab-actuales">
        <div id="proyectos-grid" class="grid-cards" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:var(--space-5);"></div>

        <div class="state-panel" id="proyectos-empty" hidden>
          <span class="state-panel-icon"><svg class="icon icon-lg"><use href="../../static/img/icons.svg#icon-search"></use></svg></span>
          <span class="state-panel-desc">No se encontraron proyectos con ese nombre o estado.</span>
        </div>

        <div id="proyectos-pagination" style="display:flex; justify-content:space-between; align-items:center; margin-top:var(--space-6);">
          <span class="text-tertiary" style="font-size:var(--fs-xs);" id="proyectos-pagination-count"></span>
          <div class="pagination" id="proyectos-pagination-controls"></div>
        </div>
      </div>

      <section class="card" id="tab-historial" hidden style="display:flex; flex-direction:column; height:calc(100vh - var(--topbar-h) - (var(--space-6) * 2) - 100px); overflow:hidden;">
        <div class="table-toolbar" style="flex-shrink:0;">
          <div class="card-header-icon-row">
            <span class="card-header-icon blue"><svg class="icon icon-sm"><use href="../../static/img/icons.svg#icon-folder"></use></svg></span>
            <div>
              <strong id="historial-count"></strong>
              <p class="text-tertiary" style="font-size:var(--fs-xs); margin-top:2px;">Todos tus proyectos, actuales e históricos</p>
            </div>
          </div>
        </div>
        <div class="table-scroll-wrap">
          <div class="table-scroll">
            <table class="data-table">
              <thead class="sticky-head"><tr><th>Proyecto</th><th>Cliente</th><th>Rol</th><th>Periodo</th><th>Estado</th></tr></thead>
              <tbody id="historial-body"></tbody>
            </table>
          </div>
        </div>
        <div class="table-footer" style="flex-shrink:0;">
          <span class="text-tertiary" style="font-size:var(--fs-xs);" id="historial-pagination-count"></span>
          <div class="pagination" id="historial-pagination-controls"></div>
        </div>
      </section>

    </main>
  </div>
</div>

<script src="../../static/js/mock-data.js"></script>
<script src="../../static/js/state.js"></script>
<script src="../../static/js/toast.js"></script>
<script src="../../static/js/dropdown.js"></script>
<script src="../../static/js/table-filter.js"></script>
<script src="../../static/js/command-palette.js"></script>
<script src="../../static/js/modal.js"></script>
<script src="../../static/js/shell.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var cfg = SBAI.shell.init({ role: "colaborador", active: "proyectos.html", title: "Mis proyectos", subtitle: "12 proyectos actuales · 5 históricos" });
  if (!cfg) return;

  var PAGE_SIZE = 6;
  var currentPage = 1;

  // Asignaciones actuales de Mariana (demo): todos los proyectos del catálogo
  // global que no están Cerrados, con un rol y dedicación inventados para
  // cada uno. Solo para tener suficiente data y poder probar la paginación.
  var actuales = MOCK.projects.filter(function (p) { return p.estado !== "Cerrado"; }).map(function (p, i) {
    var roles = ["Frontend Sr.", "Frontend", "Consultora UI", "Backend", "QA", "DevOps"];
    var dedic = [45, 35, 20, 30, 15, 25, 10, 40, 20, 15, 30, 20];
    return { p: p, rol: roles[i % roles.length], dedicacion: dedic[i % dedic.length] };
  });

  var estadoBadge = { "Activo": "badge-green", "En riesgo": "badge-amber", "Planeado": "badge-neutral", "Bloqueado": "badge-red", "Cerrado": "badge-neutral" };

  function getFiltered() {
    var q = document.getElementById("proyectos-search").value.trim().toLowerCase();
    var estado = document.getElementById("proyectos-estado-filter").value;
    return actuales.filter(function (row) {
      var p = row.p;
      var matchesQ = !q || (p.nombre + " " + p.cliente).toLowerCase().indexOf(q) !== -1;
      var matchesEstado = estado === "todos" || p.estado === estado;
      return matchesQ && matchesEstado;
    });
  }

  function cardHtml(row) {
    var p = row.p;
    return '<div class="card card-pad">' +
      '<div style="display:flex; align-items:center; gap:var(--space-3); margin-bottom:var(--space-4);">' +
      '<span class="avatar" style="border-radius:var(--radius-md); background:var(--navy-700);">' + p.iniciales + '</span>' +
      '<div style="flex:1; min-width:0;"><div style="font-weight:600;">' + p.nombre + '</div><div class="text-tertiary" style="font-size:var(--fs-xs);">' + p.cliente + '</div></div>' +
      '<span class="badge ' + (estadoBadge[p.estado] || "badge-neutral") + '">' + p.estado + "</span></div>" +
      '<p class="text-secondary" style="font-size:var(--fs-sm); line-height:1.5; margin-bottom:var(--space-4);">' + p.descripcion.slice(0, 130) + "…</p>" +
      '<div class="progress-inline" style="margin-bottom:var(--space-4);"><div class="progress-bar"><div class="progress-bar-fill" style="width:' + p.avance + '%;"></div></div><span class="progress-value">' + p.avance + '%</span></div>' +
      '<div style="display:flex; justify-content:space-between; align-items:center;">' +
      '<span class="label-mono">' + row.rol + " · " + row.dedicacion + '% dedicación</span>' +
      '<button type="button" class="btn btn-tertiary btn-sm" data-open-detail="' + p.nombre + '">Ver detalle →</button></div>' +
      "</div>";
  }

  function wireDetailButtons() {
    document.querySelectorAll("[data-open-detail]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var p = MOCK.findProject(btn.dataset.openDetail);
        var html = '<div class="modal modal-wide" role="dialog" aria-modal="true">' +
          '<div class="modal-header"><div><h2>' + p.nombre + '</h2><p>' + p.cliente + ' · ' + p.inicio + ' → ' + p.fin + '</p></div>' +
          '<button type="button" class="modal-close" data-modal-close aria-label="Cerrar"><svg class="icon"><use href="../../static/img/icons.svg#icon-x"></use></svg></button></div>' +
          '<div class="modal-body"><p class="text-secondary" style="line-height:1.6; margin-bottom:var(--space-5);">' + p.descripcion + '</p>' +
          '<div style="display:flex; flex-wrap:wrap; gap:var(--space-2);">' + p.stack.map(function (t) { return '<span class="badge badge-neutral">' + t + '</span>'; }).join("") + '</div></div>' +
          '<div class="modal-footer"><button type="button" class="btn btn-secondary" data-modal-close>Cerrar</button></div></div>';
        SBAI.modal.open(html);
      });
    });
  }

  function renderPagination(totalItems, totalPages) {
    var countEl = document.getElementById("proyectos-pagination-count");
    var controlsEl = document.getElementById("proyectos-pagination-controls");
    var wrapEl = document.getElementById("proyectos-pagination");

    if (totalItems === 0) { wrapEl.hidden = true; return; }
    wrapEl.hidden = false;

    var start = (currentPage - 1) * PAGE_SIZE + 1;
    var end = Math.min(currentPage * PAGE_SIZE, totalItems);
    countEl.textContent = "Mostrando " + start + "–" + end + " de " + totalItems + " proyectos";

    if (totalPages <= 1) { controlsEl.innerHTML = ""; return; }

    var html = '<button type="button" class="page-btn" id="pg-prev" ' + (currentPage === 1 ? "disabled" : "") + '>‹</button>';
    for (var i = 1; i <= totalPages; i++) {
      html += '<button type="button" class="page-btn' + (i === currentPage ? " active" : "") + '" data-page="' + i + '">' + i + "</button>";
    }
    html += '<button type="button" class="page-btn" id="pg-next" ' + (currentPage === totalPages ? "disabled" : "") + '>›</button>';
    controlsEl.innerHTML = html;

    var prevBtn = document.getElementById("pg-prev");
    var nextBtn = document.getElementById("pg-next");
    if (prevBtn) prevBtn.addEventListener("click", function () { if (currentPage > 1) { currentPage--; render(); } });
    if (nextBtn) nextBtn.addEventListener("click", function () { if (currentPage < totalPages) { currentPage++; render(); } });
    controlsEl.querySelectorAll("[data-page]").forEach(function (btn) {
      btn.addEventListener("click", function () { currentPage = parseInt(btn.dataset.page, 10); render(); });
    });
  }

  function render() {
    var filtered = getFiltered();
    var totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;

    var pageItems = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

    document.getElementById("proyectos-grid").innerHTML = pageItems.map(cardHtml).join("");
    document.getElementById("proyectos-empty").hidden = filtered.length !== 0;
    document.getElementById("proyectos-grid").hidden = filtered.length === 0;

    wireDetailButtons();
    renderPagination(filtered.length, totalPages);
  }

  document.getElementById("proyectos-search").addEventListener("input", function () { currentPage = 1; render(); });
  document.getElementById("proyectos-estado-filter").addEventListener("change", function () { currentPage = 1; render(); });

  render();

  var HIST_PAGE_SIZE = 6;
  var historialPage = 1;
  var badgeCls = { "En curso": "badge-blue", "En riesgo": "badge-amber", "Cerrado": "badge-neutral" };

  function renderHistorialPagination(total, totalPages) {
    var countEl = document.getElementById("historial-pagination-count");
    var controlsEl = document.getElementById("historial-pagination-controls");
    var start = total ? (historialPage - 1) * HIST_PAGE_SIZE + 1 : 0;
    var end = Math.min(historialPage * HIST_PAGE_SIZE, total);
    countEl.textContent = "Mostrando " + start + "–" + end + " de " + total + " proyectos";
    if (totalPages <= 1) { controlsEl.innerHTML = ""; return; }
    var html = '<button type="button" class="page-btn" id="hist-pg-prev" ' + (historialPage === 1 ? "disabled" : "") + '>‹</button>';
    for (var i = 1; i <= totalPages; i++) html += '<button type="button" class="page-btn' + (i === historialPage ? " active" : "") + '" data-hist-page="' + i + '">' + i + "</button>";
    html += '<button type="button" class="page-btn" id="hist-pg-next" ' + (historialPage === totalPages ? "disabled" : "") + '>›</button>';
    controlsEl.innerHTML = html;
    var prevBtn = document.getElementById("hist-pg-prev"), nextBtn = document.getElementById("hist-pg-next");
    if (prevBtn) prevBtn.addEventListener("click", function () { if (historialPage > 1) { historialPage--; renderHistorial(); } });
    if (nextBtn) nextBtn.addEventListener("click", function () { if (historialPage < totalPages) { historialPage++; renderHistorial(); } });
    controlsEl.querySelectorAll("[data-hist-page]").forEach(function (btn) { btn.addEventListener("click", function () { historialPage = parseInt(btn.dataset.histPage, 10); renderHistorial(); }); });
  }

  function renderHistorial() {
    var list = MOCK.marianaHistorial;
    var totalPages = Math.max(1, Math.ceil(list.length / HIST_PAGE_SIZE));
    if (historialPage > totalPages) historialPage = totalPages;
    var pageItems = list.slice((historialPage - 1) * HIST_PAGE_SIZE, historialPage * HIST_PAGE_SIZE);

    document.getElementById("historial-count").textContent = list.length + " proyecto" + (list.length === 1 ? "" : "s") + " en tu historial";
    document.getElementById("historial-body").innerHTML = pageItems.map(function (h, i) {
      return '<tr data-f-estado="' + h.estado + '" style="animation-delay:' + (i * 30) + 'ms;"><td class="cell-primary">' + h.proyecto + "</td><td>" + h.cliente + "</td><td>" + h.rol + "</td><td>" + h.periodo + "</td>" +
        '<td><span class="badge ' + (badgeCls[h.estado] || "badge-neutral") + '">' + h.estado + "</span></td></tr>";
    }).join("");

    renderHistorialPagination(list.length, totalPages);
  }
  renderHistorial();

  document.querySelectorAll("[data-tab]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("[data-tab]").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      var isActuales = btn.dataset.tab === "actuales";
      document.getElementById("tab-actuales").hidden = !isActuales;
      document.getElementById("proyectos-toolbar").hidden = !isActuales;
      document.getElementById("historial-body").closest("section").hidden = isActuales;
    });
  });
});
</script>
</body>
</html>
