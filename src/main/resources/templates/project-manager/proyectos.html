<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyectos · SkillBridge AI</title>
<link rel="stylesheet" href="../../static/css/tokens.css">
<link rel="stylesheet" href="../../static/css/base.css">
<link rel="stylesheet" href="../../static/css/components.css">
<link rel="stylesheet" href="../../static/css/layout.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sbai-sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="sbai-topbar"></header>
    <main class="page-content" id="page-content">

      <section class="card" style="display:flex; flex-direction:column; height:calc(100vh - var(--topbar-h) - (var(--space-6) * 2)); overflow:hidden;">
        <div class="table-toolbar" style="flex-shrink:0;">
          <div>
            <strong id="proj-count">7 proyectos</strong>
            <p class="text-tertiary" style="font-size:var(--fs-xs); margin-top:2px;">4 activos · 1 en riesgo · 1 bloqueado · 1 cerrado</p>
          </div>
          <div class="table-filters">
            <select class="select" data-filter-scope="proyectos-pm" data-filter-key="estado">
              <option value="todos">Estado: todos</option><option>Activo</option><option>En riesgo</option><option>Planeado</option><option>Bloqueado</option><option>Cerrado</option>
            </select>
            <select class="select" data-filter-scope="proyectos-pm" data-filter-key="cliente">
              <option value="todos">Cliente: todos</option>
            </select>
            <select class="select" data-filter-scope="proyectos-pm" data-filter-key="tecnologia">
              <option value="todos">Tecnología: todas</option>
              <option>Java 21</option><option>React 18</option><option>Kubernetes</option><option>Kafka</option><option>Terraform</option>
            </select>
            <button type="button" class="btn btn-primary btn-sm" id="new-project-btn">
              <svg class="icon icon-sm"><use href="../../static/img/icons.svg#icon-plus"></use></svg>Crear proyecto</button>
          </div>
        </div>

        <div class="table-scroll" style="flex:1; overflow-y:auto;">
          <table class="data-table">
            <thead class="sticky-head"><tr><th>Proyecto</th><th>Cliente</th><th>PM</th><th>Fechas</th><th>Equipo</th><th>% Avance</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody id="proj-body"></tbody>
          </table>
          <div class="state-panel" data-filter-empty="proyectos-pm" hidden>
            <span class="state-panel-icon"><svg class="icon"><use href="../../static/img/icons.svg#icon-folder"></use></svg></span>
            <span class="state-panel-title">Sin proyectos con estos filtros</span>
            <span class="state-panel-desc">Ajusta el estado, cliente o tecnología para ver más resultados.</span>
          </div>
        </div>

        <div class="table-footer" style="flex-shrink:0;">
          <span class="text-tertiary" style="font-size:var(--fs-xs);">Mostrando <span id="visible-count">7</span> de 27 proyectos</span>
          <div class="pagination" id="pagination"></div>
        </div>
      </section>

    </main>
  </div>
</div>

<script src="../../static/js/mock-data.js"></script>
<script src="../../static/js/state.js"></script>
<script src="../../static/js/toast.js"></script>
<script src="../../static/js/dropdown.js"></script>
<script src="../../static/js/table-filter.js"></script>
<script src="../../static/js/command-palette.js"></script>
<script src="../../static/js/modal.js"></script>
<script src="../../static/js/shell.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var cfg = SBAI.shell.init({ role: "project-manager", active: "proyectos.html", title: "Proyectos", subtitle: "Gestión de proyectos › Listado" });
  if (!cfg) return;

  var estadoBadge = { "Activo": "badge-green", "En riesgo": "badge-amber", "Planeado": "badge-neutral", "Bloqueado": "badge-red", "Cerrado": "badge-neutral" };

  var clienteSelect = document.querySelector('[data-filter-key="cliente"]');
  var clientes = Array.from(new Set(MOCK.projects.map(function (p) { return p.cliente; })));
  clientes.forEach(function (c) { clienteSelect.insertAdjacentHTML("beforeend", '<option>' + c + "</option>"); });

  document.getElementById("proj-body").innerHTML = MOCK.projects.map(function (p, i) {
    return '<tr data-filter-row="proyectos-pm" data-f-estado="' + p.estado + '" data-f-cliente="' + p.cliente + '" data-f-tecnologia="' + p.stack.join(",") + '" style="animation-delay:' + (i * 30) + 'ms;">' +
      '<td class="cell-person"><span class="avatar avatar-sm" style="border-radius:var(--radius-sm); background:var(--navy-700);">' + p.iniciales + '</span>' +
      '<span class="cell-person-text"><span class="cell-person-name">' + p.nombre + '</span><span class="cell-person-sub">' + p.codigo + '</span></span></td>' +
      "<td>" + p.cliente + "</td><td>" + p.pm + "</td>" +
      "<td>" + p.inicio + " → " + p.fin + "</td><td>" + p.equipo + "</td>" +
      '<td><div class="progress-inline" style="min-width:100px;"><div class="progress-bar"><div class="progress-bar-fill" data-target="' + p.avance + '" style="width:0%;"></div></div><span class="progress-value">' + p.avance + '%</span></div></td>' +
      '<td><span class="badge ' + (estadoBadge[p.estado] || "badge-neutral") + '">' + p.estado + '</span></td>' +
      '<td class="cell-actions">' + (p.nombre === "Núcleo Retail" ? '<a href="proyecto-detalle.html">Ver detalle</a>' : '<button type="button" data-toast-detail="' + p.nombre + '">Ver detalle</button>') +
      ' <button type="button" data-edit-project="' + p.nombre + '">Editar</button></td></tr>';
  }).join("");

  // Anima las barras de avance de 0 al valor real, con un pequeño stagger
  document.querySelectorAll(".progress-bar-fill[data-target]").forEach(function (bar, i) {
    setTimeout(function () { bar.style.width = bar.dataset.target + "%"; }, 150 + i * 40);
  });

  document.querySelectorAll("[data-toast-detail]").forEach(function (btn) {
    btn.addEventListener("click", function () { SBAI.toast.show("El detalle completo está disponible para <strong>Núcleo Retail</strong> en esta demo. Los demás proyectos usan el mismo layout."); });
  });
  document.querySelectorAll("[data-edit-project]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var p = MOCK.findProject(btn.dataset.editProject);
      var html = '<div class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><h2>Editar ' + p.nombre + '</h2><p>' + p.codigo + '</p></div>' +
        '<button type="button" class="modal-close" data-modal-close aria-label="Cerrar"><svg class="icon"><use href="../../static/img/icons.svg#icon-x"></use></svg></button></div>' +
        '<div class="modal-body"><div class="field"><label class="field-label">Nombre</label><input class="input" value="' + p.nombre + '"></div>' +
        '<div class="field"><label class="field-label">Estado</label><select class="select"><option' + (p.estado === "Activo" ? " selected" : "") + '>Activo</option><option' + (p.estado === "En riesgo" ? " selected" : "") + '>En riesgo</option><option' + (p.estado === "Planeado" ? " selected" : "") + '>Planeado</option><option' + (p.estado === "Bloqueado" ? " selected" : "") + '>Bloqueado</option><option' + (p.estado === "Cerrado" ? " selected" : "") + '>Cerrado</option></select></div></div>' +
        '<div class="modal-footer"><button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button><button type="button" class="btn btn-primary" data-modal-close>Guardar cambios</button></div></div>';
      var backdrop = SBAI.modal.open(html);
      backdrop.querySelectorAll(".btn-primary").forEach(function (b) { b.addEventListener("click", function () { SBAI.toast.show("Cambios guardados en <strong>" + p.nombre + "</strong>.", { type: "success" }); }); });
    });
  });

  document.getElementById("new-project-btn").addEventListener("click", function () {
    var html = '<div class="modal modal-wide" role="dialog" aria-modal="true"><div class="modal-header"><div><h2>Crear proyecto</h2><p>Define los datos base; podrás completar el equipo después.</p></div>' +
      '<button type="button" class="modal-close" data-modal-close aria-label="Cerrar"><svg class="icon"><use href="../../static/img/icons.svg#icon-x"></use></svg></button></div>' +
      '<div class="modal-body"><div class="field-row"><div class="field"><label class="field-label">Nombre del proyecto</label><input class="input" id="np-nombre" placeholder="Nombre"></div>' +
      '<div class="field"><label class="field-label">Cliente</label><input class="input" id="np-cliente" placeholder="Cliente"></div></div>' +
      '<div class="field-row"><div class="field"><label class="field-label">Inicio</label><input class="input" type="date"></div><div class="field"><label class="field-label">Fin estimado</label><input class="input" type="date"></div></div></div>' +
      '<div class="modal-footer"><button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button><button type="button" class="btn btn-primary" id="create-project-confirm">Crear proyecto</button></div></div>';
    var backdrop = SBAI.modal.open(html);
    backdrop.querySelector("#create-project-confirm").addEventListener("click", function () {
      var nombre = backdrop.querySelector("#np-nombre").value.trim() || "Nuevo proyecto";
      SBAI.modal.close(backdrop);
      SBAI.toast.show("<strong>" + nombre + "</strong> creado como Planeado. Agrega el equipo desde su detalle.", { type: "success" });
    });
  });

  window.SBAI.tableFilter.registerCustomMatcher("proyectos-pm", "tecnologia", function (row, value) {
    return row.dataset.fTecnologia.split(",").indexOf(value) !== -1;
  });
  window.SBAI.tableFilter.init(document);

  var pageEl = document.getElementById("pagination");
  [1, 2, 3, 4].forEach(function (n) {
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "page-btn" + (n === 1 ? " active" : ""); btn.textContent = n;
    btn.addEventListener("click", function () {
      document.querySelectorAll(".page-btn").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      SBAI.toast.show("Página " + n + " simulada — esta demo incluye 7 de los 27 proyectos.");
    });
    pageEl.appendChild(btn);
  });
});
</script>
</body>
</html>
