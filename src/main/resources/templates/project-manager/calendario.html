<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario · SkillBridge AI</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    .agenda-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-5)}
    .calendar-event-card{--event-accent:#4778dc;--event-soft:#edf3ff;position:relative;display:flex;align-items:flex-start;gap:var(--space-4);overflow:hidden;cursor:pointer;background:linear-gradient(135deg,#fff 60%,var(--event-soft));box-shadow:0 4px 14px rgba(15,31,66,.05);padding:var(--space-4) var(--space-4) var(--space-4) calc(var(--space-4) + 4px);transition:box-shadow .15s,transform .15s}
    .calendar-event-card:hover{box-shadow:0 8px 22px rgba(15,31,66,.09);transform:translateY(-1px)}
    .calendar-event-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--event-accent)}
    .calendar-event-card[data-tipo="entregable"]{--event-accent:#d9574d;--event-soft:#fff2ef}
    .calendar-event-card[data-tipo="hito"]{--event-accent:#45a15c;--event-soft:#effaf2}
    .calendar-event-card .event-card-date{flex:0 0 56px;width:56px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;color:var(--event-accent);background:var(--event-soft);border:1px solid color-mix(in srgb,var(--event-accent) 18%,transparent)}
    .calendar-event-card .event-card-date-day{font-size:19px;font-weight:750;line-height:1.1}
    .calendar-event-card .event-card-date-month{font-size:9px;font-weight:650;letter-spacing:.04em}
    .calendar-event-card .event-card-body{min-width:0;flex:1}
    .event-type{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--event-accent)}
    .event-type-icon{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;color:var(--event-accent);background:var(--event-soft)}
    .event-type-icon .icon{width:12px;height:12px}
    .calendar-event-card .event-card-title{font-size:var(--fs-md);margin-top:6px}
    .calendar-event-card .event-card-meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
    .calendar-event-card .event-card-time{margin-top:2px}
    .agenda-pagination{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-top:var(--space-6);padding:0 2px}
    .event-card-actions{display:flex;gap:6px;margin-left:auto;flex:0 0 auto}
    .event-card-actions button{background:none;border:none;cursor:pointer;color:var(--text-tertiary);padding:4px;border-radius:6px;display:grid;place-items:center}
    .event-card-actions button:hover{background:var(--event-soft);color:var(--event-accent)}
    .event-card-actions button.danger:hover{background:#fff2ef;color:#d9574d}
    .event-card-actions .icon{width:14px;height:14px}
    /* Modal "Ver detalle" del evento */
    .event-detail-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:var(--space-5)}
    .event-detail-rows{display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-4);border-radius:12px;background:var(--surface-sunken);margin-bottom:var(--space-5)}
    .event-detail-row{display:flex;align-items:flex-start;gap:12px}
    .event-detail-row .icon{width:16px;height:16px;flex:0 0 auto;margin-top:2px;color:var(--text-tertiary)}
    .event-detail-row-body{display:flex;flex-direction:column;gap:2px;min-width:0}
    .event-detail-label{font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--text-tertiary)}
    .event-detail-value{font-size:var(--fs-sm);color:var(--text-primary);word-break:break-word}
    .event-detail-value a{color:var(--event-accent, #4778dc);text-decoration:none}
    .event-detail-value a:hover{text-decoration:underline}
    .event-detail-desc-label{font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--text-tertiary);margin-bottom:6px;display:block}
    .event-detail-desc-text{font-size:var(--fs-sm);color:var(--text-secondary);line-height:1.6;white-space:pre-wrap}
    @media(max-width:1100px){.agenda-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:720px){.agenda-grid{grid-template-columns:1fr}.agenda-pagination{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <main class="page-content" id="page-content">

      <section class="card card-pad" style="margin-bottom:var(--space-5);">
        <div class="table-toolbar" style="border:none; padding:0;">
          <div class="segmented" id="tipo-tabs">
            <button type="button" class="segmented-btn active" data-tipo="todos">Todos</button>
            <button type="button" class="segmented-btn" data-tipo="reunion">Reuniones</button>
            <button type="button" class="segmented-btn" data-tipo="entregable">Entregables</button>
            <button type="button" class="segmented-btn" data-tipo="hito">Hitos</button>
          </div>
          <div class="table-filters">
            <select class="select" id="proyecto-filter" style="max-width:220px;">
              <option value="todos">Todos mis proyectos</option>
              <option th:each="p : ${proyectos}" th:value="${p.nombre()}" th:text="${p.nombre()}">Proyecto</option>
            </select>
            <button type="button" class="btn btn-primary btn-sm" id="new-event-btn" th:if="${!proyectos.isEmpty()}">
              <svg class="icon icon-sm"><use href="/img/icons.svg#icon-plus"></use></svg>Nuevo evento</button>
          </div>
        </div>
      </section>

      <div th:if="${eventos.isEmpty()}" class="card">
        <div class="state-panel">
          <span class="state-panel-icon"><svg class="icon"><use href="/img/icons.svg#icon-calendar"></use></svg></span>
          <span class="state-panel-title">Todavia no hay eventos</span>
          <span class="state-panel-desc" th:text="${proyectos.isEmpty()} ? 'No tienes proyectos donde crear eventos.' : 'Crea el primero con \'Nuevo evento\'.'">—</span>
        </div>
      </div>

      <div th:unless="${eventos.isEmpty()}" class="agenda-grid" id="agenda-grid">
        <div class="event-card calendar-event-card" th:each="e : ${eventos}" data-evento
             th:attr="data-tipo=${e.tipoCodigo}, data-proyecto=${e.proyectoNombre},
                      data-id=${e.id}, data-proyecto-id=${e.proyectoId}, data-titulo=${e.titulo},
                      data-descripcion=${e.descripcion} ?: '', data-ubicacion=${e.ubicacion} ?: '',
                      data-enlace=${e.enlaceVirtual} ?: '', data-audiencia=${e.audienciaCodigo},
                      data-fecha-iso=${e.fechaInicioIso}, data-tipo-nombre=${e.tipoNombre},
                      data-audiencia-label=${e.audienciaLabel}, data-estado=${e.estado},
                      data-fecha-label=${e.fechaLabel}, data-hora-label=${e.horaLabel},
                      data-puede-gestionar=${e.puedeGestionar}"
             th:classappend="${e.tipoCodigo == 'entregable'} ? ' event-entregable' : (${e.tipoCodigo == 'hito'} ? ' event-hito' : ' event-reunion')">
          <div class="event-card-date">
            <div class="event-card-date-day" th:text="${e.diaNum}">5</div>
            <div class="event-card-date-month" th:text="${e.mesAbrev}">AGO</div>
          </div>
          <div class="event-card-body">
            <div class="event-card-top">
              <span class="event-type"><span class="event-type-icon"><svg class="icon"><use th:href="${e.tipoCodigo == 'entregable'} ? '/img/icons.svg#icon-download' : (${e.tipoCodigo == 'hito'} ? '/img/icons.svg#icon-target' : '/img/icons.svg#icon-users')"></use></svg></span><span th:text="${e.tipoNombre}">Reunión</span></span>
              <span class="badge"
                    th:classappend="${e.estado == 'cumplido' ? 'badge-green' : (e.estado == 'atrasado' ? 'badge-red' : (e.estado == 'cancelado' ? 'badge-neutral' : 'badge-blue'))}"
                    th:text="${e.estado}">estado</span>
              <div class="event-card-actions" th:if="${e.puedeGestionar}">
                <button type="button" data-edit-evento title="Editar evento" aria-label="Editar evento">
                  <svg class="icon"><use href="/img/icons.svg#icon-edit"></use></svg>
                </button>
                <button type="button" class="danger" data-delete-evento title="Eliminar evento" aria-label="Eliminar evento">
                  <svg class="icon"><use href="/img/icons.svg#icon-trash"></use></svg>
                </button>
              </div>
            </div>
            <div class="event-card-title" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span th:text="${e.titulo}">Titulo</span>
              <span class="badge badge-neutral" th:if="${e.audienciaCodigo == 'solo_pm'}" style="font-size:10px;">Solo PM</span>
            </div>
            <div class="event-card-meta" th:text="${e.proyectoNombre} + ' · ' + ${e.ubicacionLabel}">proyecto</div>
            <div class="event-card-time" th:text="${e.fechaLabel} + ' · ' + ${e.horaLabel}">fecha</div>
          </div>
        </div>
      </div>

      <div class="card" id="agenda-empty" hidden>
        <div class="state-panel">
          <span class="state-panel-title">Sin eventos con este filtro</span>
          <span class="state-panel-desc">Prueba con otro tipo o proyecto.</span>
        </div>
      </div>

      <div class="agenda-pagination" id="agenda-pagination" th:unless="${eventos.isEmpty()}">
        <span class="text-tertiary" style="font-size:var(--fs-xs)">Mostrando <strong id="agenda-range">0–0</strong> de <strong id="agenda-total">0</strong> eventos</span>
        <div class="pagination" id="agenda-pages" aria-label="Paginación del calendario"></div>
      </div>

    </main>
  </div>
</div>

<script src="/js/toast.js"></script>
<script src="/js/dropdown.js"></script>
<script src="/js/command-palette.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/topbar-actions.js"></script>
<script th:inline="javascript">
  window.SBAI_FLASH = { exito: /*[[${exito}]]*/ null, error: /*[[${error}]]*/ null };
  var NUEVO_URL = /*[[${nuevoUrl}]]*/ "/project-manager/calendario/nuevo";
  var EDITAR_BASE_URL = "/project-manager/calendario/";
  var ELIMINAR_BASE_URL = "/project-manager/calendario/";
  var PROYECTOS = /*[[${proyectos}]]*/ [];
  var TIPOS_EVENTO = /*[[${tiposEvento}]]*/ [];
  var TIPOS_AUDIENCIA = /*[[${tiposAudiencia}]]*/ [];

  // Arman las opciones del <select> a partir de los catalogos reales
  // (tipos_evento / tipos_audiencia) en vez de tenerlas escritas a mano -
  // si el Administrador agrega un tipo nuevo desde su panel, aparece aqui
  // solo, sin tocar este archivo.
  function tipoOptions() {
    return TIPOS_EVENTO.map(function (t) {
      return '<option value="' + t.codigo + '">' + t.nombre + '</option>';
    }).join("");
  }
  function audienciaOptions() {
    return TIPOS_AUDIENCIA.map(function (t) {
      return '<option value="' + t.codigo + '">' + t.nombre + '</option>';
    }).join("");
  }
  function horaDropdownItems() {
    var out = "";
    for (var h = 0; h < 24; h++) {
      var v = (h < 10 ? "0" : "") + h;
      out += '<button type="button" class="dropdown-item" data-hora-value="' + v + '" style="justify-content:center; padding:6px 4px;">' + v + '</button>';
    }
    return out;
  }
  function minutoOptions() {
    return ["00", "15", "30", "45"].map(function (m) {
      return '<option value="' + m + '">' + m + '</option>';
    }).join("");
  }

  document.addEventListener("DOMContentLoaded", function () {
    var submitForm = window.SBAI.submitForm;
    var cards = Array.prototype.slice.call(document.querySelectorAll("[data-evento]"));
    var tipoActivo = "todos";
    var proyectoActivo = "todos";
    var paginaActual = 1;
    var porPagina = 6;

    function aplicar() {
      var filtradas = cards.filter(function (c) {
        var okTipo = tipoActivo === "todos" || c.getAttribute("data-tipo") === tipoActivo;
        var okProy = proyectoActivo === "todos" || c.getAttribute("data-proyecto") === proyectoActivo;
        return okTipo && okProy;
      });
      var paginas = Math.max(1, Math.ceil(filtradas.length / porPagina));
      paginaActual = Math.min(paginaActual, paginas);
      var inicio = (paginaActual - 1) * porPagina;
      var fin = Math.min(inicio + porPagina, filtradas.length);

      cards.forEach(function (c) {
        c.hidden = true;
      });
      filtradas.slice(inicio, fin).forEach(function (c) { c.hidden = false; });

      var empty = document.getElementById("agenda-empty");
      if (empty) empty.hidden = filtradas.length !== 0 || cards.length === 0;
      var pagination = document.getElementById("agenda-pagination");
      if (pagination) pagination.hidden = filtradas.length === 0;
      var range = document.getElementById("agenda-range");
      var total = document.getElementById("agenda-total");
      if (range) range.textContent = filtradas.length ? (inicio + 1) + "–" + fin : "0–0";
      if (total) total.textContent = filtradas.length;
      dibujarPaginas(paginas);
    }

    function botonPagina(texto, destino, activo, deshabilitado, etiqueta) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "page-btn" + (activo ? " active" : "");
      btn.textContent = texto;
      btn.disabled = deshabilitado;
      if (etiqueta) btn.setAttribute("aria-label", etiqueta);
      btn.addEventListener("click", function () { paginaActual = destino; aplicar(); });
      return btn;
    }

    function dibujarPaginas(paginas) {
      var contenedor = document.getElementById("agenda-pages");
      if (!contenedor) return;
      contenedor.innerHTML = "";
      contenedor.appendChild(botonPagina("‹", paginaActual - 1, false, paginaActual === 1, "Página anterior"));
      for (var i = 1; i <= paginas; i++) {
        contenedor.appendChild(botonPagina(String(i), i, i === paginaActual, false, "Página " + i));
      }
      contenedor.appendChild(botonPagina("›", paginaActual + 1, false, paginaActual === paginas, "Página siguiente"));
    }

    document.querySelectorAll("#tipo-tabs [data-tipo]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll("#tipo-tabs [data-tipo]").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        tipoActivo = btn.dataset.tipo;
        paginaActual = 1;
        aplicar();
      });
    });
    var proyFilter = document.getElementById("proyecto-filter");
    if (proyFilter) proyFilter.addEventListener("change", function () { proyectoActivo = this.value; paginaActual = 1; aplicar(); });

    var newBtn = document.getElementById("new-event-btn");
    if (newBtn) {
      newBtn.addEventListener("click", function () {
        var opts = PROYECTOS.map(function (p) { return '<option value="' + p.id + '">' + p.nombre + '</option>'; }).join("");
        var html = '<div class="modal modal-wide" role="dialog" aria-modal="true">' +
                '<div class="modal-header"><div><h2>Nuevo evento</h2><p>Se agrega al calendario del equipo del proyecto.</p></div>' +
                '<button type="button" class="modal-close" data-modal-close aria-label="Cerrar"><svg class="icon"><use href="/img/icons.svg#icon-x"></use></svg></button></div>' +
                '<div class="modal-body">' +
                '<div class="field-row"><div class="field"><label class="field-label">Proyecto</label><select class="select" id="ev-proj">' + opts + '</select></div>' +
                '<div class="field"><label class="field-label">Tipo</label><select class="select" id="ev-tipo">' + tipoOptions() + '</select></div></div>' +
                '<div class="field"><label class="field-label">Titulo</label><input class="input" id="ev-titulo" placeholder="Daily de sprint, Entrega v1..."></div>' +
                '<div class="field-row"><div class="field"><label class="field-label">Fecha y hora</label><div style="display:flex; gap:6px;"><input class="input" type="date" id="ev-fecha-dia" style="flex:1; min-width:0; padding-left:8px; padding-right:4px;"><div class="dropdown" style="flex:0 0 auto;"><button type="button" class="input" data-dropdown-trigger="ev-hora-dd" style="width:58px; padding:0 8px; display:flex; align-items:center; justify-content:space-between; cursor:pointer;"><span data-hora-label>00</span><svg class="icon" style="width:14px; height:14px;"><use href="/img/icons.svg#icon-chevron-down"></use></svg></button><div class="dropdown-panel" data-dropdown-panel="ev-hora-dd" style="max-height:210px; overflow-y:auto; min-width:58px; padding:4px;">' + horaDropdownItems() + '</div><input type="hidden" id="ev-fecha-hora" value="00"></div><select class="select" id="ev-fecha-min" style="width:64px; flex:0 0 auto;">' + minutoOptions() + '</select></div></div>' +
                '<div class="field"><label class="field-label">Audiencia</label><select class="select" id="ev-aud">' + audienciaOptions() + '</select></div></div>' +
                '<div class="field-row"><div class="field"><label class="field-label">Ubicacion (opcional)</label><input class="input" id="ev-ubic" placeholder="Sala 3 / Oficina"></div>' +
                '<div class="field"><label class="field-label">Enlace virtual (opcional)</label><input class="input" id="ev-enlace" placeholder="https://meet..."></div></div>' +
                '<div class="field"><label class="field-label">Descripcion (opcional)</label><textarea class="input" id="ev-desc" rows="2" style="height:auto; padding:var(--space-3) var(--space-4);"></textarea></div>' +
                '</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button><button type="button" class="btn btn-primary" id="ev-confirm">Crear evento</button></div></div>';
        var backdrop = SBAI.modal.open(html);
        if (window.SBAI.dropdown) window.SBAI.dropdown.init(document);
        backdrop.querySelectorAll("[data-hora-value]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            backdrop.querySelector("#ev-fecha-hora").value = btn.dataset.horaValue;
            backdrop.querySelector('[data-dropdown-trigger="ev-hora-dd"] [data-hora-label]').textContent = btn.dataset.horaValue;
            window.SBAI.dropdown.close("ev-hora-dd");
          });
        });
        backdrop.querySelector("#ev-confirm").addEventListener("click", function () {
          var titulo = backdrop.querySelector("#ev-titulo").value.trim();
          var dia = backdrop.querySelector("#ev-fecha-dia").value;
          var hora = backdrop.querySelector("#ev-fecha-hora").value;
          var minuto = backdrop.querySelector("#ev-fecha-min").value;
          var fecha = dia ? (dia + "T" + hora + ":" + minuto) : "";
          if (!titulo) { SBAI.toast.show("Escribe un titulo.", { type: "error" }); return; }
          if (!dia) { SBAI.toast.show("Selecciona la fecha y hora.", { type: "error" }); return; }
          submitForm(NUEVO_URL, {
            proyectoId: backdrop.querySelector("#ev-proj").value,
            tipo: backdrop.querySelector("#ev-tipo").value,
            titulo: titulo,
            fechaInicio: fecha,
            audiencia: backdrop.querySelector("#ev-aud").value,
            ubicacion: backdrop.querySelector("#ev-ubic").value,
            enlace: backdrop.querySelector("#ev-enlace").value,
            descripcion: backdrop.querySelector("#ev-desc").value
          });
        });
      });
    }
    // ───────── Editar / Eliminar evento ─────────
    // Comparte el mismo formulario (fecha con hora en dropdown + minutos)
    // que "Nuevo evento", pero sin el <select> de proyecto: un evento no
    // cambia de proyecto al editarse, solo sus datos.
    function abrirModalEditar(card) {
      var d = card.dataset;
      var partes = (d.fechaIso || "").split("T"); // "2026-09-20T08:30" -> ["2026-09-20","08:30"]
      var dia = partes[0] || "";
      var horaMin = (partes[1] || "00:00").split(":");
      var hora = horaMin[0] || "00";
      var minuto = horaMin[1] || "00";
      var html = '<div class="modal modal-wide" role="dialog" aria-modal="true">' +
              '<div class="modal-header"><div><h2>Editar evento</h2><p>' + d.proyecto + '</p></div>' +
              '<button type="button" class="modal-close" data-modal-close aria-label="Cerrar"><svg class="icon"><use href="/img/icons.svg#icon-x"></use></svg></button></div>' +
              '<div class="modal-body">' +
              '<div class="field"><label class="field-label">Tipo</label><select class="select" id="ed-tipo">' + tipoOptions() + '</select></div>' +
              '<div class="field"><label class="field-label">Titulo</label><input class="input" id="ed-titulo" value="' + (d.titulo || "").replace(/"/g, "&quot;") + '"></div>' +
              '<div class="field-row"><div class="field"><label class="field-label">Fecha y hora</label><div style="display:flex; gap:6px;"><input class="input" type="date" id="ed-fecha-dia" value="' + dia + '" style="flex:1; min-width:0; padding-left:8px; padding-right:4px;"><div class="dropdown" style="flex:0 0 auto;"><button type="button" class="input" data-dropdown-trigger="ed-hora-dd" style="width:58px; padding:0 8px; display:flex; align-items:center; justify-content:space-between; cursor:pointer;"><span data-hora-label>' + hora + '</span><svg class="icon" style="width:14px; height:14px;"><use href="/img/icons.svg#icon-chevron-down"></use></svg></button><div class="dropdown-panel" data-dropdown-panel="ed-hora-dd" style="max-height:210px; overflow-y:auto; min-width:58px; padding:4px;">' + horaDropdownItems() + '</div><input type="hidden" id="ed-fecha-hora" value="' + hora + '"></div><select class="select" id="ed-fecha-min" style="width:64px; flex:0 0 auto;">' + minutoOptions() + '</select></div></div>' +
              '<div class="field"><label class="field-label">Audiencia</label><select class="select" id="ed-aud">' + audienciaOptions() + '</select></div></div>' +
              '<div class="field-row"><div class="field"><label class="field-label">Ubicacion (opcional)</label><input class="input" id="ed-ubic" value="' + (d.ubicacion || "").replace(/"/g, "&quot;") + '" placeholder="Sala 3 / Oficina"></div>' +
              '<div class="field"><label class="field-label">Enlace virtual (opcional)</label><input class="input" id="ed-enlace" value="' + (d.enlace || "").replace(/"/g, "&quot;") + '" placeholder="https://meet..."></div></div>' +
              '<div class="field"><label class="field-label">Descripcion (opcional)</label><textarea class="input" id="ed-desc" rows="2" style="height:auto; padding:var(--space-3) var(--space-4);">' + (d.descripcion || "") + '</textarea></div>' +
              '</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button><button type="button" class="btn btn-primary" id="ed-confirm">Guardar cambios</button></div></div>';
      var backdrop = SBAI.modal.open(html);
      if (window.SBAI.dropdown) window.SBAI.dropdown.init(document);
      backdrop.querySelector("#ed-tipo").value = d.tipo;
      backdrop.querySelector("#ed-aud").value = d.audiencia;
      backdrop.querySelectorAll("[data-hora-value]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          backdrop.querySelector("#ed-fecha-hora").value = btn.dataset.horaValue;
          backdrop.querySelector('[data-dropdown-trigger="ed-hora-dd"] [data-hora-label]').textContent = btn.dataset.horaValue;
          window.SBAI.dropdown.close("ed-hora-dd");
        });
      });
      backdrop.querySelector("#ed-confirm").addEventListener("click", function () {
        var titulo = backdrop.querySelector("#ed-titulo").value.trim();
        var diaVal = backdrop.querySelector("#ed-fecha-dia").value;
        var horaVal = backdrop.querySelector("#ed-fecha-hora").value;
        var minutoVal = backdrop.querySelector("#ed-fecha-min").value;
        var fecha = diaVal ? (diaVal + "T" + horaVal + ":" + minutoVal) : "";
        if (!titulo) { SBAI.toast.show("Escribe un titulo.", { type: "error" }); return; }
        if (!diaVal) { SBAI.toast.show("Selecciona la fecha y hora.", { type: "error" }); return; }
        submitForm(EDITAR_BASE_URL + d.id + "/editar", {
          tipo: backdrop.querySelector("#ed-tipo").value,
          titulo: titulo,
          fechaInicio: fecha,
          audiencia: backdrop.querySelector("#ed-aud").value,
          ubicacion: backdrop.querySelector("#ed-ubic").value,
          enlace: backdrop.querySelector("#ed-enlace").value,
          descripcion: backdrop.querySelector("#ed-desc").value
        });
      });
    }

    function confirmarEliminar(card) {
      SBAI.modal.confirm({
        title: "¿Eliminar \"" + card.dataset.titulo + "\"?",
        desc: "Esta accion no se puede deshacer.",
        confirmLabel: "Eliminar", variant: "destructive",
        onConfirm: function () { submitForm(ELIMINAR_BASE_URL + card.dataset.id + "/eliminar", {}); }
      });
    }

    document.querySelectorAll("[data-edit-evento]").forEach(function (btn) {
      btn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        abrirModalEditar(btn.closest("[data-evento]"));
      });
    });

    document.querySelectorAll("[data-delete-evento]").forEach(function (btn) {
      btn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        confirmarEliminar(btn.closest("[data-evento]"));
      });
    });

    // ───────── Ver detalle del evento ─────────
    // Click en cualquier parte de la tarjeta (fuera de los botones de accion,
    // que ya frenan la propagacion arriba) abre un modal de solo lectura con
    // TODOS los datos: fecha, hora, ubicacion/enlace, audiencia y descripcion
    // completa - la tarjeta solo muestra un resumen recortado.
    var CLASE_TIPO = { entregable: "badge-red", hito: "badge-green", reunion: "badge-blue" };
    var CLASE_ESTADO = { cumplido: "badge-green", atrasado: "badge-red", cancelado: "badge-neutral" };

    function esUrl(texto) {
      return /^https?:\/\//i.test(texto || "");
    }

    function escaparHtml(texto) {
      var div = document.createElement("div");
      div.textContent = texto || "";
      return div.innerHTML;
    }

    function abrirModalDetalle(card) {
      var d = card.dataset;
      var claseEstado = CLASE_ESTADO[d.estado] || "badge-blue";
      var puedeGestionar = d.puedeGestionar === "true";

      var filas = "";
      filas += '<div class="event-detail-row">' + icono("icon-calendar") +
              '<div class="event-detail-row-body"><span class="event-detail-label">Fecha y hora</span>' +
              '<span class="event-detail-value">' + escaparHtml(d.fechaLabel) + ' · ' + escaparHtml(d.horaLabel) + '</span></div></div>';
      if (d.ubicacion) {
        filas += '<div class="event-detail-row">' + icono("icon-pin") +
                '<div class="event-detail-row-body"><span class="event-detail-label">Ubicacion</span>' +
                '<span class="event-detail-value">' + escaparHtml(d.ubicacion) + '</span></div></div>';
      }
      if (d.enlace) {
        var valorEnlace = esUrl(d.enlace)
                ? '<a href="' + escaparHtml(d.enlace) + '" target="_blank" rel="noopener">' + escaparHtml(d.enlace) + '</a>'
                : escaparHtml(d.enlace);
        filas += '<div class="event-detail-row">' + icono("icon-external-link") +
                '<div class="event-detail-row-body"><span class="event-detail-label">Enlace virtual</span>' +
                '<span class="event-detail-value">' + valorEnlace + '</span></div></div>';
      }
      filas += '<div class="event-detail-row">' + icono("icon-users") +
              '<div class="event-detail-row-body"><span class="event-detail-label">Audiencia</span>' +
              '<span class="event-detail-value">' + escaparHtml(d.audienciaLabel) + '</span></div></div>';

      var descripcionHtml = d.descripcion
              ? '<div class="event-detail-desc-text">' + escaparHtml(d.descripcion) + '</div>'
              : '<div class="event-detail-desc-text text-tertiary">Sin descripcion.</div>';

      var botonesFooter = '<button type="button" class="btn btn-secondary" data-modal-close>Cerrar</button>';
      if (puedeGestionar) {
        botonesFooter += '<button type="button" class="btn btn-destructive-solid" id="det-eliminar">Eliminar</button>' +
                '<button type="button" class="btn btn-primary" id="det-editar">Editar</button>';
      }

      var html = '<div class="modal modal-wide" role="dialog" aria-modal="true">' +
              '<div class="modal-header"><div><h2>' + escaparHtml(d.titulo) + '</h2><p>' + escaparHtml(d.proyecto) + '</p></div>' +
              '<button type="button" class="modal-close" data-modal-close aria-label="Cerrar">' + icono("icon-x") + '</button></div>' +
              '<div class="modal-body">' +
              '<div class="event-detail-badges">' +
              '<span class="badge ' + (CLASE_TIPO[d.tipo] || "badge-blue") + '">' + escaparHtml(d.tipoNombre) + '</span>' +
              '<span class="badge ' + claseEstado + '">' + escaparHtml(d.estado) + '</span>' +
              (d.audiencia === "solo_pm" ? '<span class="badge badge-neutral">Solo PM</span>' : '') +
              '</div>' +
              '<div class="event-detail-rows">' + filas + '</div>' +
              '<span class="event-detail-desc-label">Descripcion</span>' + descripcionHtml +
              '</div><div class="modal-footer">' + botonesFooter + '</div></div>';

      var backdrop = SBAI.modal.open(html);
      if (puedeGestionar) {
        backdrop.querySelector("#det-editar").addEventListener("click", function () {
          SBAI.modal.closeTop();
          abrirModalEditar(card);
        });
        backdrop.querySelector("#det-eliminar").addEventListener("click", function () {
          SBAI.modal.closeTop();
          confirmarEliminar(card);
        });
      }
    }

    function icono(nombre) {
      return '<svg class="icon"><use href="/img/icons.svg#' + nombre + '"></use></svg>';
    }

    cards.forEach(function (card) {
      card.addEventListener("click", function (ev) {
        if (ev.target.closest(".event-card-actions")) return;
        abrirModalDetalle(card);
      });
    });

    aplicar();
  });
</script>
</body>
</html>
