<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisar entregable · SkillBridge AI</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <main class="page-content" id="page-content">

      <section class="card card-pad">
        <p class="text-tertiary" style="font-size:var(--fs-xs); margin-bottom:var(--space-2);">
          <a th:href="@{'/project-manager/proyectos/' + ${proyecto.id} + '/entregables.html'}" class="text-tertiary">← Volver a Entregables</a>
        </p>
        <h2 style="font-size:var(--fs-lg);" th:text="${entregable.titulo}">Título</h2>
        <p class="text-secondary" style="margin:var(--space-2) 0 var(--space-4);" th:text="${entregable.descripcion} ?: 'Sin descripción.'">Descripción</p>
        <div class="info-row"><span class="info-row-label">Apertura → Cierre</span>
          <span class="info-row-value" th:text="${fechaAperturaLabel} + ' → ' + ${fechaCierreLabel}">fechas</span></div>
        <div class="info-row"><span class="info-row-label">Puntaje máximo</span><span class="info-row-value mono" th:text="${entregable.puntajeMaximo}">20</span></div>
      </section>

      <section class="card" style="margin-top:var(--space-6);">
        <div class="table-toolbar">
          <div>
            <strong th:text="${entregas.size()} + ' colaborador(es)'">0</strong>
            <p class="text-tertiary" style="font-size:var(--fs-xs); margin-top:2px;">Equipo activo del proyecto</p>
          </div>
          <div class="table-filters">
            <select class="select" data-filter-scope="entregas-pm" data-filter-key="estado">
              <option value="todos">Estado: todos</option>
              <option value="sin_entregar">Sin entregar</option><option value="enviado">Entregado</option><option value="revisado">Revisado</option>
            </select>
          </div>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Colaborador</th><th>Fecha de entrega</th><th>Contenido</th><th>Estado</th><th>Calificación</th><th>Acciones</th></tr></thead>
            <tbody>
              <tr th:each="f : ${entregas}" data-filter-row="entregas-pm" th:attr="data-f-estado=${f.estadoCrudo}">
                <td class="cell-person"><span class="avatar avatar-sm" th:text="${f.iniciales}">MR</span><span class="cell-person-name" th:text="${f.nombre}">Nombre</span></td>
                <td class="text-tertiary" style="font-size:var(--fs-xs);">
                  <span th:text="${f.fechaEntregaLabel}">fecha</span>
                  <span class="badge badge-amber" style="margin-left:4px;" th:if="${f.atrasado}">Atrasado</span>
                </td>
                <td style="max-width:260px;">
                  <span th:if="${!f.entrego}" class="text-tertiary" style="font-size:var(--fs-xs);">—</span>
                  <div th:if="${f.entrego}" style="display:flex; flex-direction:column; gap:2px; font-size:var(--fs-xs);">
                    <a th:if="${f.urlEntrega}" th:href="${f.urlEntrega}" target="_blank" rel="noopener">🔗 Link</a>
                    <a th:if="${f.tieneArchivo}" th:href="@{'/entregas/' + ${f.entregaId} + '/archivo'}" target="_blank" th:text="'📎 ' + ${f.archivoNombre}">archivo</a>
                    <span th:if="${f.texto}" class="text-secondary" th:text="${f.texto}" style="white-space:pre-wrap;">texto</span>
                  </div>
                </td>
                <td><span class="badge" th:classappend="${f.estadoBadgeClass}" th:text="${f.estadoLabel}">Estado</span></td>
                <td class="mono" th:text="${f.calificacionLabel} + ' / ' + ${entregable.puntajeMaximo}">— / 20</td>
                <td class="cell-actions">
                  <button type="button" th:if="${f.entrego}"
                          th:attr="data-calificar=${f.entregaId}, data-nombre=${f.nombre}, data-calificacion=${f.calificacionLabel != '—' ? f.calificacionLabel : ''}, data-comentario=${f.comentarioPm}">
                    Revisar</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="state-panel" data-filter-empty="entregas-pm" hidden>
          <span class="state-panel-icon"><svg class="icon"><use href="/img/icons.svg#icon-users"></use></svg></span>
          <span class="state-panel-title">Nadie con este estado</span>
        </div>
        <div class="table-footer">
          <span class="text-tertiary" style="font-size:var(--fs-xs)">Mostrando <span id="rev-visible-count">0</span> de <span id="rev-filtered-count">0</span></span>
          <div class="pagination"><button class="page-btn" id="rev-prev" type="button" aria-label="Página anterior">‹</button><span class="text-tertiary" id="rev-page-label" style="font-size:var(--fs-xs)">Página 1</span><button class="page-btn" id="rev-next" type="button" aria-label="Página siguiente">›</button></div>
        </div>
      </section>

    </main>
  </div>
</div>

<script src="/js/toast.js"></script>
<script src="/js/dropdown.js"></script>
<script src="/js/table-filter.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/command-palette.js"></script>
<script src="/js/topbar-actions.js"></script>
<script th:inline="javascript">
window.SBAI_FLASH = { exito: /*[[${exito}]]*/ null, error: /*[[${error}]]*/ null };
var ENTREGABLE_ID = /*[[${entregable.id}]]*/ 0;
document.addEventListener("DOMContentLoaded", function () {
  window.SBAI.tableFilter.init(document);
  var submitForm = window.SBAI.submitForm;

  document.querySelectorAll("[data-calificar]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var entregaId = btn.dataset.calificar;
      var html = '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal-header"><div><h2>Revisar entrega</h2><p>' + btn.dataset.nombre + '</p></div>' +
        '<button type="button" class="modal-close" data-modal-close aria-label="Cerrar"><svg class="icon"><use href="/img/icons.svg#icon-x"></use></svg></button></div>' +
        '<div class="modal-body">' +
        '<div class="field"><label class="field-label">Calificación</label><input class="input" type="number" min="0" step="0.5" id="cal-nota" value="' + (btn.dataset.calificacion || "") + '"></div>' +
        '<div class="field"><label class="field-label">Comentario</label><textarea class="input" id="cal-comentario" rows="4" style="height:auto; padding:var(--space-3) var(--space-4);">' + (btn.dataset.comentario || "") + '</textarea></div>' +
        '</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button><button type="button" class="btn btn-primary" id="cal-confirm">Guardar revisión</button></div></div>';
      var backdrop = SBAI.modal.open(html);
      backdrop.querySelector("#cal-confirm").addEventListener("click", function () {
        submitForm("/project-manager/entregas/" + entregaId + "/calificar", {
          entregableId: ENTREGABLE_ID,
          calificacion: backdrop.querySelector("#cal-nota").value,
          comentario: backdrop.querySelector("#cal-comentario").value
        });
      });
    });
  });

  (function () {
    var rows = Array.from(document.querySelectorAll('tr[data-filter-row="entregas-pm"]'));
    if (!rows.length) return;
    var estadoSelect = document.querySelector('[data-filter-scope="entregas-pm"][data-filter-key="estado"]');
    var emptyPanel = document.querySelector('[data-filter-empty="entregas-pm"]');
    var visibleCount = document.getElementById("rev-visible-count");
    var filteredCount = document.getElementById("rev-filtered-count");
    var pageLabel = document.getElementById("rev-page-label");
    var previous = document.getElementById("rev-prev");
    var next = document.getElementById("rev-next");
    var pageSize = 8, page = 1;

    function matches(row) {
      var estado = estadoSelect ? estadoSelect.value : "todos";
      return !estado || estado === "todos" || row.dataset.fEstado === estado;
    }
    function render() {
      var matched = rows.filter(matches);
      var pages = Math.max(1, Math.ceil(matched.length / pageSize));
      page = Math.min(page, pages);
      var visible = matched.slice((page - 1) * pageSize, page * pageSize);
      rows.forEach(function (row) { row.hidden = true; });
      visible.forEach(function (row) { row.hidden = false; });
      if (emptyPanel) emptyPanel.hidden = matched.length !== 0;
      visibleCount.textContent = visible.length;
      filteredCount.textContent = matched.length;
      pageLabel.textContent = "Página " + page + " de " + pages;
      previous.disabled = page === 1;
      next.disabled = page === pages;
    }
    if (estadoSelect) estadoSelect.addEventListener("change", function () { page = 1; render(); });
    previous.addEventListener("click", function () { if (page > 1) { page--; render(); } });
    next.addEventListener("click", function () {
      var matched = rows.filter(matches);
      var pages = Math.max(1, Math.ceil(matched.length / pageSize));
      if (page < pages) { page++; render(); }
    });
    render();
  })();
});
</script>
</body>
</html>
