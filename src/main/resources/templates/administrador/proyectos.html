<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyectos · SkillBridge AI</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/polish.css">
<link rel="stylesheet" href="/css/proyecto-form.css">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <main class="page-content" id="page-content">

      <section class="card">
        <div class="table-toolbar">
          <div>
            <strong th:text="${proyectos.size()} + ' proyectos'">0 proyectos</strong>
            <p class="text-tertiary" style="font-size:var(--fs-xs); margin-top:2px;">Vista global con datos completos</p>
          </div>
          <div class="table-filters">
            <input type="text" class="input" data-filter-scope="proyectos-admin" data-filter-key="q" placeholder="Buscar por nombre…" style="width:200px; height:36px; font-size:var(--fs-xs);">
            <select class="select" data-filter-scope="proyectos-admin" data-filter-key="estado">
              <option value="todos">Estado: todos</option>
              <option value="planificacion">Planificación</option><option value="activo">Activo</option>
              <option value="en_pausa">En pausa</option><option value="completado">Completado</option><option value="cancelado">Cancelado</option>
            </select>
            <button type="button" class="btn btn-primary btn-sm" id="new-project-btn"><svg class="icon icon-sm"><use href="/img/icons.svg#icon-plus"></use></svg>Nuevo proyecto</button>
          </div>
        </div>
        <div data-project-filters="proyectos-admin"></div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Proyecto</th><th>PM</th><th>Periodo / duración</th><th>Miembros</th><th>% Avance</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody>
              <tr th:each="p, stat : ${proyectos}" data-filter-row="proyectos-admin" th:attr="data-f-estado=${p.estadoCrudo},data-f-search=${#strings.toLowerCase(p.nombre)}">
                <td class="cell-person">
                  <span class="avatar avatar-sm" style="border-radius:var(--radius-sm); background:var(--navy-700);" th:text="${#strings.substring(p.nombre, 0, 1)}">P</span>
                  <span class="cell-person-text"><span class="cell-person-name" th:text="${p.nombre}">Proyecto</span><span data-tech-list th:attr="data-tech-list=${#strings.listJoin(p.tecnologias, ',')}" data-max="2"></span></span>
                </td>
                <td th:text="${p.pmNombre}">PM</td>
                <td><span data-periodo th:attr="data-ini=${p.fechaInicioLabel},data-fin=${p.fechaFinLabel}">fechas</span></td>
                <td><span class="miembros-pill" th:attr="data-n=${p.equipoSize}"><svg class="icon icon-sm"><use href="/img/icons.svg#icon-users"></use></svg><span th:text="${p.equipoSize} + (${p.equipoSize} == 1 ? ' miembro' : ' miembros')">0 miembros</span></span></td>
                <td><div class="progress-inline" style="min-width:100px;"><div class="progress-bar"><div class="progress-bar-fill" th:style="'width:' + ${p.avance} + '%;'"></div></div><span class="progress-value" th:text="${p.avance} + '%'">0%</span></div></td>
                <td><span class="badge" th:classappend="${p.estadoBadgeClass}" th:text="${p.estadoLabel}">Estado</span></td>
                <td class="cell-actions"><button type="button" th:attr="data-view-project=${p.id}">Ver detalle</button></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="state-panel" data-filter-empty="proyectos-admin" hidden>
          <span class="state-panel-icon"><svg class="icon"><use href="/img/icons.svg#icon-folder"></use></svg></span>
          <span class="state-panel-title">Sin proyectos con estos filtros</span>
        </div>
        <div class="table-footer">
          <span class="text-tertiary" style="font-size:var(--fs-xs)">Mostrando <span id="proyectos-visible-count">0</span> de <span id="proyectos-filtered-count">0</span> proyectos</span>
          <div class="pagination"><button class="page-btn" id="proyectos-prev" type="button" aria-label="Página anterior">‹</button><span class="text-tertiary" id="proyectos-page-label" style="font-size:var(--fs-xs)">Página 1</span><input type="number" id="proyectos-page-jump" min="1" value="1" aria-label="Ir a la página" class="input" style="width:3.4em; text-align:center; font-size:var(--fs-xs); padding:2px 4px;"><button class="page-btn" id="proyectos-next" type="button" aria-label="Página siguiente">›</button></div>
        </div>
      </section>

      <!-- Detalle precalculado por proyecto (ver Javadoc de AdminProyectosController) -->
      <div id="project-detail-templates" hidden>
        <template th:each="d : ${detalles}" th:attr="data-project-id=${d.id}">
            <div class="modal-header">
              <div><h2 th:text="${d.nombre}">Proyecto</h2><p th:text="${d.estadoLabel} + ' · PM: ' + ${d.pmNombre}">Estado</p></div>
              <button type="button" class="modal-close" data-modal-close aria-label="Cerrar"><svg class="icon"><use href="/img/icons.svg#icon-x"></use></svg></button>
            </div>
            <div class="modal-body">
              <p class="text-secondary" style="line-height:1.6; margin-bottom:var(--space-4);" th:text="${d.descripcion} ?: 'Sin descripción.'">Descripción</p>
              <div style="display:flex; flex-wrap:wrap; gap:var(--space-2); margin-bottom:var(--space-4);">
                <span data-tech-list th:attr="data-tech-list=${d.tecnologiasCsv}"></span>
              </div>
              <div class="info-row"><span class="info-row-label">Fechas</span><span class="info-row-value" th:text="${d.fechaInicioLabel} + ' → ' + ${d.fechaFinLabel}">fechas</span></div>
              <div class="info-row"><span class="info-row-label">Avance (heurístico por tiempo transcurrido)</span><span class="info-row-value mono" th:text="${d.avance} + '%'">0%</span></div>
              <div class="info-row"><span class="info-row-label">Colaboradores requeridos</span><span class="info-row-value" th:text="${d.colaboradoresRequeridos}">0</span></div>

              <h3 style="font-size:var(--fs-sm); margin:var(--space-5) 0 var(--space-3);">Equipo activo</h3>
              <div th:if="${d.equipo.isEmpty()}" class="text-tertiary" style="font-size:var(--fs-xs);">Sin colaboradores asignados todavía.</div>
              <div th:each="m : ${d.equipo}" style="display:flex; align-items:center; gap:var(--space-3); padding:var(--space-2) 0; border-bottom:1px solid var(--border-subtle);">
                <span class="avatar avatar-sm" th:text="${m.iniciales}">MR</span>
                <span style="flex:1; min-width:0;">
                  <div style="font-size:var(--fs-sm); font-weight:500;" th:text="${m.nombre}">Nombre</div>
                  <div class="text-tertiary" style="font-size:var(--fs-xs);" th:text="${m.correo}">correo</div>
                </span>
                <span class="badge" th:classappend="${m.rolEnProyectoCrudo == 'project_manager'} ? 'badge-blue' : 'badge-neutral'" th:text="${m.rolLabel}">Rol</span>
                <span class="mono text-secondary" style="font-size:var(--fs-xs); min-width:3.5em; text-align:right;" th:text="${m.cargaPorcentaje} + '%'">0%</span>
              </div>
              <!-- Modelo v7: el Administrador no asigna ni finaliza (lo hace el Resource Manager; el PM propone). -->
              <div class="readonly-note">
                <svg class="icon icon-sm" aria-hidden="true"><use href="/img/icons.svg#icon-info"></use></svg>
                <span>Vista de solo lectura. Las asignaciones las gestiona el <strong>Resource Manager</strong> (asigna y cambia el Project Manager) y el <strong>Project Manager</strong> propone colaboradores.</span>
              </div>

              <!-- Modelo v7, fase 2: transiciones con efectos (pausa, cierre, reapertura). -->
              <th:block th:replace="~{fragments/estado-proyecto :: estado(${d})}"></th:block>
            </div>
            <div class="modal-footer">
              <a class="btn btn-secondary" th:href="@{'/administrador/proyectos/' + ${d.id} + '/entregables.html'}" style="text-decoration:none;">Ver entregables</a>
              <button type="button" class="btn btn-secondary" data-modal-close>Cerrar</button>
            </div>
        </template>
      </div>

    </main>
  </div>
</div>

<script src="/js/toast.js"></script>
<script src="/js/dropdown.js"></script>
<script src="/js/table-filter.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/topbar-actions.js"></script>
<script th:inline="javascript">
window.SBAI_FLASH = { exito: /*[[${exito}]]*/ null, error: /*[[${error}]]*/ null };
window.SBAI_CATALOGO_TEC = /*[[${catalogoTecnologias}]]*/ [];
window.SBAI_MAX_TEC = /*[[${maxTecnologias}]]*/ 12;
document.addEventListener("DOMContentLoaded", function () {
  window.SBAI.tableFilter.init(document);
  var submitForm = window.SBAI.submitForm;

  document.querySelectorAll("[data-view-project]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var id = btn.dataset.viewProject;
      var tpl = document.querySelector('#project-detail-templates template[data-project-id="' + id + '"]');
      if (!tpl) return;
      var backdrop = SBAI.modal.open('<div class="modal modal-wide" role="dialog" aria-modal="true">' + tpl.innerHTML + '</div>');

      var estadoSelect = backdrop.querySelector('[data-field="estado"]');
      var estadoBtn = backdrop.querySelector("[data-cambiar-estado]");
      if (estadoBtn) {
        estadoBtn.addEventListener("click", function () {
          var proyectoId = estadoBtn.dataset.cambiarEstado;
          var datos = SBAI.proyectoAcciones.datosDeModal(backdrop);
          SBAI.proyectoAcciones.cambiarEstado({
            url: "/administrador/proyectos/" + proyectoId + "/estado",
            nombre: (backdrop.querySelector("h2") || {}).textContent,
            // "Reabrir" no tiene selector: su destino viene en data-estado-destino.
            actual: estadoSelect ? estadoSelect.getAttribute("data-actual") : estadoBtn.dataset.estadoActual,
            nuevo: estadoBtn.dataset.estadoDestino || estadoSelect.value,
            colaboradoresActivos: datos.colaboradoresActivos,
            equipoAnterior: datos.equipoAnterior
          });
        });
      }
    });
  });

  // Nuevo proyecto: stack con chips del catálogo de habilidades
  // (SBAI.techInput) y rango de fechas con mínimo de 7 días, atajos y
  // resumen en vivo (SBAI.dateRange). Ambos en /js/proyecto-form.js.
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
  function isoHoy() { var d = new Date(); return SBAI.dateRange.aIso(d); }

  document.getElementById("new-project-btn").addEventListener("click", function () {
    var opts = /*[[${perfiles}]]*/ [];
    var options = opts.map(function (p) { return '<option value="' + p.perfilId + '">' + esc(p.nombre) + ' · ' + esc(p.correo) + '</option>'; }).join("");
    var hoy = isoHoy();
    var html = '<div class="modal modal-wide pf-modal" role="dialog" aria-modal="true" aria-labelledby="np-titulo">' +
      '<div class="modal-header"><div><h2 id="np-titulo">Nuevo proyecto</h2><p>Asigna un Project Manager responsable.</p></div>' +
      '<button type="button" class="modal-close" data-modal-close aria-label="Cerrar"><svg class="icon"><use href="/img/icons.svg#icon-x"></use></svg></button></div>' +
      '<div class="modal-body">' +
      '<div class="callout danger" id="np-error" hidden style="margin-bottom:var(--space-4);">' +
        '<span class="callout-icon"><svg class="icon"><use href="/img/icons.svg#icon-alert-triangle"></use></svg></span>' +
        '<span class="callout-body" id="np-error-text"></span></div>' +
      '<div class="field"><label class="field-label" for="np-nombre">Nombre</label><input class="input" id="np-nombre" maxlength="150" placeholder="Ej.: Portal de clientes"><div class="field-error"></div></div>' +
      '<div class="field"><label class="field-label" for="np-desc">Descripción</label><textarea class="input" id="np-desc" rows="3" style="height:auto; padding:var(--space-3) var(--space-4);" placeholder="¿Qué se va a construir y para quién?"></textarea></div>' +
      '<div class="field"><div class="pf-label-row"><label class="field-label" for="np-tech-input">Stack tecnológico</label>' +
        '<span class="field-hint">Del catálogo de habilidades</span></div><div id="np-tech"></div></div>' +
      '<div class="field-row">' +
        '<div class="field"><label class="field-label" for="np-inicio">Inicio</label><input class="input" type="date" id="np-inicio" min="' + hoy + '"><div class="field-error"></div></div>' +
        '<div class="field"><label class="field-label" for="np-fin">Entrega esperada</label><input class="input" type="date" id="np-fin"><div class="field-error"></div></div>' +
      '</div>' +
      '<div class="dr-presets" id="np-atajos"></div>' +
      '<div class="dr-summary" id="np-resumen" aria-live="polite"></div>' +
      '<div class="field-row"><div class="field"><label class="field-label" for="np-colab">Colaboradores requeridos</label><input class="input" type="number" min="0" value="3" id="np-colab"><div class="field-error"></div></div>' +
      '<div class="field"><label class="field-label" for="np-pm">Project Manager</label><select class="select" id="np-pm" data-combobox data-placeholder="Escribe para buscar al PM…">' + options + '</select></div></div>' +
      '</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button><button type="button" class="btn btn-primary" id="np-confirm">Crear proyecto</button></div></div>';
    var backdrop = SBAI.modal.open(html);
    var tech = SBAI.techInput.create(backdrop.querySelector("#np-tech"), {
      catalogo: window.SBAI_CATALOGO_TEC || [], valores: [], max: window.SBAI_MAX_TEC || 12, inputId: "np-tech-input"
    });
    var fechas = SBAI.dateRange.create({
      inicio: backdrop.querySelector("#np-inicio"), fin: backdrop.querySelector("#np-fin"),
      resumen: backdrop.querySelector("#np-resumen"), atajos: backdrop.querySelector("#np-atajos"),
      minInicio: hoy, diasMinimos: 7
    });
    var nombreInput = backdrop.querySelector("#np-nombre");
    var colabInput = backdrop.querySelector("#np-colab");
    var errorBox = backdrop.querySelector("#np-error");
    nombreInput.addEventListener("input", function () { fechas.limpiar(nombreInput); });
    colabInput.addEventListener("input", function () { fechas.limpiar(colabInput); });
    setTimeout(function () { nombreInput.focus(); }, 50);

    backdrop.querySelector("#np-confirm").addEventListener("click", function () {
      errorBox.hidden = true;
      if (!nombreInput.value.trim()) { fechas.marcar(nombreInput, "Ingresa un nombre para el proyecto."); nombreInput.focus(); return; }
      var f = fechas.validar();
      if (f) { f.campo.focus(); return; }
      var colab = colabInput.value === "" ? 0 : Number(colabInput.value);
      if (!(colab >= 0) || Math.floor(colab) !== colab) { fechas.marcar(colabInput, "Ingresa un número entero desde 0."); colabInput.focus(); return; }
      var pm = backdrop.querySelector("#np-pm").value;
      if (!pm) {
        backdrop.querySelector("#np-error-text").textContent = "Elige al Project Manager responsable del proyecto.";
        errorBox.hidden = false; return;
      }
      submitForm("/administrador/proyectos", {
        nombre: nombreInput.value.trim(),
        descripcion: backdrop.querySelector("#np-desc").value,
        tecnologias: tech.getValues().join(","),
        fechaInicio: backdrop.querySelector("#np-inicio").value,
        fechaFinEstimada: backdrop.querySelector("#np-fin").value,
        colaboradoresRequeridos: String(colab),
        pmPerfilId: pm
      });
    });
  });

  // Paginación de la tabla, encima del filtrado de table-filter.js: no se
  // toca el filtro de Estado, solo se agrega que de los resultados que
  // coinciden se muestren de a 6 (mismo patron que administrador/usuarios.html
  // y administrador/habilidades.html).
  (function () {
    var rows = Array.from(document.querySelectorAll('tr[data-filter-row="proyectos-admin"]'));
    if (!rows.length) return;

    var estadoSelect = document.querySelector('[data-filter-scope="proyectos-admin"][data-filter-key="estado"]');
    var emptyPanel = document.querySelector('[data-filter-empty="proyectos-admin"]');
    var visibleCount = document.getElementById("proyectos-visible-count");
    var filteredCount = document.getElementById("proyectos-filtered-count");
    var pageLabel = document.getElementById("proyectos-page-label");
    var previous = document.getElementById("proyectos-prev");
    var next = document.getElementById("proyectos-next");
    var pageJump = document.getElementById("proyectos-page-jump");
    var pageSize = 6;
    var page = 1;

    var searchInput = document.querySelector('[data-filter-scope="proyectos-admin"][data-filter-key="q"]');

    function normalizarTexto(v) {
      return (v || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    }

    function matches(row) {
      var estado = estadoSelect ? estadoSelect.value : "todos";
      if (estado && estado !== "todos" && row.dataset.fEstado !== estado) return false;
      var q = searchInput ? normalizarTexto(searchInput.value) : "";
      if (q && normalizarTexto(row.dataset.fSearch).indexOf(q) === -1) return false;
      if (window.SBAI.extraRowFilter && !window.SBAI.extraRowFilter("proyectos-admin", row)) return false;
      return true;
    }

    function render() {
      var matched = rows.filter(matches);
      var pages = Math.max(1, Math.ceil(matched.length / pageSize));
      page = Math.min(page, pages);
      var visible = matched.slice((page - 1) * pageSize, page * pageSize);
      rows.forEach(function (row) { row.hidden = true; });
      visible.forEach(function (row) { row.hidden = false; });
      if (emptyPanel) emptyPanel.hidden = matched.length !== 0;
      visibleCount.textContent = visible.length;
      filteredCount.textContent = matched.length;
      pageLabel.textContent = "Página " + page + " de " + pages;
      previous.disabled = page === 1;
      next.disabled = page === pages;
      if (pageJump) {
        pageJump.max = pages;
        if (document.activeElement !== pageJump) pageJump.value = page;
      }
    }

    if (estadoSelect) estadoSelect.addEventListener("change", function () { page = 1; render(); });
    if (searchInput) searchInput.addEventListener("input", function () { page = 1; render(); });
    previous.addEventListener("click", function () { if (page > 1) { page--; render(); } });
    next.addEventListener("click", function () {
      var matched = rows.filter(matches);
      var pages = Math.max(1, Math.ceil(matched.length / pageSize));
      if (page < pages) { page++; render(); }
    });
    if (pageJump) {
      function irAPagina() {
        var matched = rows.filter(matches);
        var pages = Math.max(1, Math.ceil(matched.length / pageSize));
        var destino = parseInt(pageJump.value, 10);
        if (isNaN(destino)) return;
        page = Math.min(Math.max(destino, 1), pages);
        render();
      }
      pageJump.addEventListener("change", irAPagina);
      pageJump.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); irAPagina(); } });
    }
    render();
  })();
});
</script>
<script src="/js/global-search.js"></script>
<script src="/js/predictive.js"></script>
<script src="/js/battery-progress.js"></script>
<script src="/js/paginacion.js"></script>
<script src="/js/mobile-nav.js"></script>
<script src="/js/tech-icons.js"></script>
<script src="/js/proyecto-form.js"></script>
<script src="/js/proyecto-acciones.js"></script>
<script src="/js/project-ui.js"></script>
<script src="/js/tabla-acciones.js"></script>
</body>
</html>
