<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoría · SkillBridge AI</title>
<link rel="stylesheet" href="../../static/css/tokens.css">
<link rel="stylesheet" href="../../static/css/base.css">
<link rel="stylesheet" href="../../static/css/components.css">
<link rel="stylesheet" href="../../static/css/layout.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sbai-sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="sbai-topbar"></header>
    <main class="page-content" id="page-content">

      <div class="kpi-grid" id="kpi-grid"></div>

      <div class="detail-grid" style="margin-top:var(--space-6); grid-template-columns: 2.4fr 1fr;">
        <section class="card">
          <div class="table-toolbar">
            <div>
              <strong id="log-count"></strong>
              <p class="text-tertiary" style="font-size:var(--fs-xs); margin-top:2px;">Registro de acciones sobre roles, asignaciones e IA</p>
            </div>
            <div class="table-filters">
              <select class="select" data-filter-scope="audit" data-filter-key="tipo">
                <option value="todos">Tipo: todos</option><option value="roles">Roles y usuarios</option><option value="asignaciones">Asignaciones</option><option value="ia">Sistema / IA</option>
              </select>
              <select class="select" data-filter-scope="audit" data-filter-key="severidad">
                <option value="todos">Severidad: todas</option><option>Alta</option><option>Media</option><option>Info</option>
              </select>
            </div>
          </div>
          <div class="table-scroll">
            <table class="data-table">
              <thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th><th>Origen</th><th>Severidad</th></tr></thead>
              <tbody id="audit-body"></tbody>
            </table>
          </div>
          <div class="state-panel" data-filter-empty="audit" hidden>
            <span class="state-panel-icon"><svg class="icon"><use href="../../static/img/icons.svg#icon-shield"></use></svg></span>
            <span class="state-panel-title">Sin eventos con estos filtros</span>
          </div>
        </section>

        <section class="card card-pad">
          <h3 style="font-size:var(--fs-md); margin-bottom:var(--space-4);">Usuarios con más eventos</h3>
          <div id="top-users"></div>
        </section>
      </div>

    </main>
  </div>
</div>

<script src="../../static/js/mock-data.js"></script>
<script src="../../static/js/state.js"></script>
<script src="../../static/js/toast.js"></script>
<script src="../../static/js/dropdown.js"></script>
<script src="../../static/js/table-filter.js"></script>
<script src="../../static/js/command-palette.js"></script>
<script src="../../static/js/modal.js"></script>
<script src="../../static/js/shell.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var cfg = SBAI.shell.init({ role: "administrador", active: "auditoria.html", title: "Auditoría", subtitle: "Trazabilidad completa de acciones en la plataforma" });
  if (!cfg) return;

  var b = MOCK.auditSeverityBreakdown;
  document.getElementById("kpi-grid").innerHTML = [
    { label: "EVENTOS DE SEVERIDAD ALTA", value: b.alta, cls: "down" },
    { label: "EVENTOS DE SEVERIDAD MEDIA", value: b.media, cls: "warn" },
    { label: "EVENTOS INFORMATIVOS (24H)", value: b.info },
    { label: "TOTAL REGISTRADO HOY", value: b.alta + b.media + b.info }
  ].map(function (k) { return '<div class="kpi-tile"><span class="kpi-tile-label">' + k.label + '</span><span class="kpi-tile-value">' + k.value + '</span><span class="kpi-tile-meta ' + (k.cls || "") + '"></span></div>'; }).join("");

  document.getElementById("log-count").textContent = MOCK.auditLog.length + " eventos recientes";

  var sevBadge = { "Alta": "badge-red", "Media": "badge-amber", "Info": "badge-neutral" };
  document.getElementById("audit-body").innerHTML = MOCK.auditLog.map(function (a) {
    return '<tr data-filter-row="audit" data-f-tipo="' + a.tipo + '" data-f-severidad="' + a.severidad + '">' +
      '<td class="mono text-tertiary" style="font-size:var(--fs-xs);">' + a.fecha + '</td>' +
      "<td>" + a.usuario + "</td><td class=\"cell-primary\">" + a.accion + "</td><td>" + a.detalle + "</td>" +
      '<td class="mono text-tertiary" style="font-size:var(--fs-xs);">' + a.origen + '</td>' +
      '<td><span class="badge ' + (sevBadge[a.severidad] || "badge-neutral") + '">' + a.severidad + '</span></td></tr>';
  }).join("");

  document.getElementById("top-users").innerHTML = MOCK.auditTopUsers.map(function (u) {
    return '<div style="display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3) 0; border-bottom:1px solid var(--border-subtle);">' +
      '<span class="avatar avatar-sm">' + u.iniciales + '</span><span style="flex:1; font-size:var(--fs-sm); font-weight:500;">' + u.nombre + '</span>' +
      '<span class="mono text-tertiary" style="font-size:var(--fs-xs);">' + u.eventos + ' eventos</span></div>';
  }).join("");

  window.SBAI.tableFilter.init(document);
});
</script>
</body>
</html>
