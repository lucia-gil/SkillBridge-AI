<!DOCTYPE html>
<!--
  fragments/topbar.html
-->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<th:block th:fragment="topbar">
<header class="topbar">
  <script th:nonce="${cspNonce}">try{if(localStorage.getItem("sbai-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>

  <!-- Token CSRF de Spring Security para formularios/fetch armados por JS -->
  <th:block th:replace="~{fragments/seguridad :: csrf}"></th:block>

  <!-- MENÚ (solo celular / pantallas angostas) -->
  <button type="button" class="topbar-icon-btn topbar-menu-btn" data-action="toggle-sidebar" aria-label="Abrir menú de navegación">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <div class="topbar-heading">
    <span class="topbar-title" th:text="${title}">Título</span>
    <span class="topbar-subtitle" th:text="${subtitle} ?: ''">Subtítulo</span>
  </div>


  <!-- BUSCADOR GLOBAL PREDICTIVO (desde 2 letras) -->

  <div class="gs" data-global-search role="search">
    <label class="gs-field">
      <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#icon-search"></use></svg>
      <input type="text" class="gs-input" placeholder="Busca o pregúntale a la IA…"
             autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-label="Buscar en SkillBridge AI">
      <button type="button" class="gs-clear" hidden aria-label="Limpiar búsqueda">
        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button type="button" class="gs-ia-btn" disabled aria-label="Preguntar a la IA" title="Preguntar a la IA (Ctrl+Enter)">
        <svg class="icon icon-sm" aria-hidden="true"><use href="/img/icons.svg#icon-sparkles"></use></svg>
      </button>
      <kbd>Ctrl K</kbd>
    </label>
    <div class="gs-panel" role="listbox" hidden></div>
  </div>


  <!-- ACCIONES -->

  <div class="topbar-actions">


    <!-- "Ver como" pasó al sidebar (fragments/sidebar.html) y el Asistente IA
         se abre desde Bridgie, al pie del sidebar. -->




    <!-- TEMA CLARO / OSCURO -->

    <button
            type="button"
            class="topbar-icon-btn"
            id="theme-toggle-btn"
            aria-label="Cambiar a modo oscuro">

      <svg class="icon tt-icon tt-moon" aria-hidden="true"><use href="/img/icons.svg#icon-moon"></use></svg><svg class="icon tt-icon tt-sun" aria-hidden="true"><use href="/img/icons.svg#icon-sun"></use></svg>

    </button>


    <!-- NOTIFICACIONES -->
    <th:block th:if="${rolSlug == 'administrador'}">
      <th:block th:replace="~{fragments/admin-notificaciones :: campana}"></th:block>
    </th:block>

    <div class="dropdown" th:unless="${rolSlug == 'administrador'}">

      <button
              type="button"
              class="topbar-icon-btn"
              data-dropdown-trigger="notif-panel"
              aria-label="Notificaciones">

        <svg class="icon">
          <use href="/img/icons.svg#icon-bell"></use>
        </svg>

        <span
                class="counter-badge"
                th:if="${unreadCount > 0}"
                th:text="${unreadCount}">
          0
        </span>

      </button>


      <div
              class="dropdown-panel notif-panel align-right"
              data-dropdown-panel="notif-panel">

        <div class="notif-panel-header">

          <h3>
            Notificaciones
          </h3>

          <button
                  type="button"
                  class="btn btn-tertiary btn-sm"
                  data-action="mark-all-read-quick">

            Marcar leídas

          </button>

        </div>


        <div class="notif-panel-list">

          <div
                  class="notif-item"
                  th:classappend="${n.leida} ? '' : 'unread'"
                  th:each="n : ${notifications}">

            <span
                    class="notif-item-icon"
                    th:classappend="${n.iconClass}">

              <svg class="icon icon-sm">

                <use th:href="@{'/img/icons.svg#' + ${n.iconId}}"></use>

              </svg>

            </span>


            <span class="notif-item-body">

              <span
                      class="notif-item-title"
                      th:text="${n.titulo}">
                Título
              </span>

              <span
                      class="notif-item-desc"
                      th:text="${n.detalle}">
                Descripción
              </span>

              <span
                      class="notif-item-time"
                      th:text="${n.fechaLabel}">
                00:00
              </span>

            </span>

          </div>

        </div>


        <div class="notif-panel-footer">

          <a href="notificaciones.html">
            Ver todas las notificaciones →
          </a>

        </div>

      </div>

    </div>


    <!-- USUARIO -->

    <div class="dropdown">

      <button
              type="button"
              class="topbar-user-btn"
              data-dropdown-trigger="user-menu-topbar"
              aria-label="Menú de usuario">


        <!-- FOTO -->

        <span class="topbar-user-avatar">

          <img
                  th:if="${user.tieneFoto}"
                  th:src="@{/perfil/foto}"
                  th:alt="${user.nombre}"
                  class="topbar-user-photo">


          <!-- FALLBACK: INICIALES -->

          <span
                  th:unless="${user.tieneFoto}"
                  class="avatar avatar-sm"
                  th:text="${user.iniciales}">
            LG
          </span>

        </span>


        <!-- NOMBRE + ROL -->
        <span class="topbar-user-text">
          <span class="topbar-user-name" th:text="${user.nombre}">Nombre</span>
          <span class="topbar-user-role" th:text="${roleLabel}">Rol</span>
        </span>


        <!-- FLECHA -->

        <svg class="icon icon-sm">
          <use href="/img/icons.svg#icon-chevron-down"></use>
        </svg>

      </button>


      <!-- MENÚ EXISTENTE -->

      <div
              th:replace="~{fragments/modals :: user-menu('user-menu-topbar', 'align-right')}">
      </div>

    </div>

  </div>

</header>

  <!-- Bridgie para celular: con el sidebar oculto en un cajón, queda flotando abajo a la izquierda.
       Va FUERA del <header>: su backdrop-filter atraparía un position: fixed. -->
  <a class="bridgie-fab" th:href="@{'/' + ${rolSlug} + '/asistente-ia.html'}"
     aria-label="Abrir Bridgie, tu asistente de IA" title="Bridgie, tu asistente de IA">
    <img src="/img/bridgie.png" alt="" width="52" height="52">
  </a>
</th:block>

</body>
</html>
