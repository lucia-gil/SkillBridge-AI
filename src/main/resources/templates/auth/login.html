<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · SkillBridge AI</title>
  <link rel="icon" type="image/png" href="/img/logo-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">

  <!--
    Login rediseñado: sin panel lateral azul. Solo la card centrada sobre
    un fondo gris claro (--canvas), en línea con el minimalismo del
    landing (publico/landing.html). Estilos con alcance local a esta
    página para no afectar registro.html / recuperar-password.html, que
    siguen usando el layout de dos columnas por ahora.
  -->
  <style>
    .login-page {
      min-height: 100vh;
      background: var(--canvas);
      background-image:
              radial-gradient(circle, rgba(139,92,246,0.06) 0%, transparent 60%),
              radial-gradient(circle at 1px 1px, rgba(22,33,58,0.06) 1px, transparent 0);
      background-size: 100% 100%, 22px 22px;
      background-position: center -10%, 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      position: relative;
    }

    .login-back-link {
      position: fixed;
      top: var(--space-6);
      left: var(--space-6);
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--fs-sm);
      font-weight: var(--fw-medium);
      color: var(--text-secondary);
      z-index: 5;
    }
    .login-back-link:hover { color: var(--text-primary); }
    .login-back-link .icon { width: 16px; height: 16px; }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-3);
      padding: var(--space-8);
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .input-wrap .input {
      border-radius: var(--radius-md);
      border: 1px solid var(--border-default);
      padding: var(--space-3) var(--space-4);
      transition: box-shadow var(--dur-fast), border-color var(--dur-fast);
    }

    .input-wrap .input:focus {
      border-color: #8B5CF6;
      box-shadow: 0 0 0 4px rgba(139,92,246,0.16);
      outline: none;
    }

    .auth-card-header {
      text-align: center;
      margin-bottom: var(--space-6);
    }
    .auth-card-header img {
      height: 34px;
      width: auto;
      object-fit: contain;
      margin: 0 auto;
      display: block;
    }

    .auth-card-title,
    .auth-card-sub {
      text-align: center;
    }
    .auth-card-sub { margin-bottom: var(--space-6); }

    .auth-card-body .field-row a {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .auth-card .btn-primary {
      background: linear-gradient(135deg, #8B5CF6 0%, #22D3EE 100%);
      border: none;
      box-shadow: 0 4px 14px rgba(139,92,246,0.28);
    }
    .auth-card .btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
    .auth-card .btn-primary:active:not(:disabled) { filter: brightness(0.96); }

    .auth-divider { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-6) 0; }
    .auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: var(--border-subtle); }
    .auth-divider span { font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--tracking-label); color: var(--text-tertiary); text-transform: uppercase; }

    @media (max-width: 480px) {
      .login-back-link { position: absolute; top: var(--space-4); left: var(--space-4); }
      .auth-card { padding: var(--space-6); }
    }
  </style>
</head>
<body>
<svg style="display:none"><use></use></svg>

<div class="login-page">
  <a class="login-back-link" th:href="@{/bienvenida.html}">
    <svg class="icon"><use href="/img/icons.svg#icon-arrow-left"></use></svg>
    Volver al inicio
  </a>

  <div class="auth-card card">

    <div class="auth-card-header">
      <img src="/img/logo-horizontal-tight.png" alt="SkillBridge AI">
    </div>

    <h2 class="auth-card-title">Iniciar sesión</h2>
    <p class="auth-card-sub">Ingresa con tu correo y contraseña.</p>

    <div th:if="${error}" th:text="${error}"
         style="background:#fdecea; border:1px solid #d32f2f; color:#b71c1c; padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:var(--fs-sm);"></div>
    <div th:if="${exito}" th:text="${exito}"
         style="background:#eaf7ec; border:1px solid #2e7d32; color:#1b5e20; padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:var(--fs-sm);"></div>

    <form class="auth-card-body" id="login-form" th:action="@{/auth/login.html}" method="post" novalidate>
      <div class="field" id="field-email">
        <label class="field-label" for="login-email">Correo corporativo</label>
        <div class="input-wrap">
          <svg class="icon"><use href="/img/icons.svg#icon-mail"></use></svg>
          <input class="input has-left-icon" type="email" id="login-email" name="email" placeholder="Ingresa tu correo electrónico"
                 th:value="${correoIntentado} ?: ''" autocomplete="username" required>
        </div>
        <div class="field-error"><svg class="icon icon-sm"><use href="/img/icons.svg#icon-alert-circle"></use></svg>Escribe un correo válido.</div>
      </div>

      <div class="field" id="field-password">
        <label class="field-label" for="login-password">Contraseña</label>
        <div class="input-wrap">
          <svg class="icon"><use href="/img/icons.svg#icon-lock"></use></svg>
          <input class="input has-left-icon" type="password" id="login-password" name="password" placeholder="••••••••••" autocomplete="current-password" required>
          <button type="button" class="input-action" data-toggle-password="login-password">Mostrar</button>
        </div>
        <div class="field-error"><svg class="icon icon-sm"><use href="/img/icons.svg#icon-alert-circle"></use></svg>Ingresa tu contraseña.</div>
      </div>

      <div class="field-row" style="align-items:center; justify-content:space-between; margin-bottom: var(--space-6);">
        <label class="checkbox-row" style="margin:0;">
          <input type="checkbox" id="keep-session" checked>
          <span class="checkbox-label">Mantener sesión activa</span>
        </label>
        <a href="recuperar-password.html" style="font-size:var(--fs-sm); font-weight:500;">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">
        Entrar
        <svg class="icon icon-sm"><use href="/img/icons.svg#icon-chevron-right"></use></svg>
      </button>

      <div class="auth-divider"><span>o bien</span></div>

      <button type="button" class="btn btn-secondary btn-block btn-lg" id="sso-btn">
        Continuar con SSO corporativo
        <svg class="icon icon-sm"><use href="/img/icons.svg#icon-external-link"></use></svg>
      </button>
    </form>
  </div>
</div>

<script src="/js/toast.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("[data-toggle-password]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var input = document.getElementById(btn.dataset.togglePassword);
        var show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.textContent = show ? "Ocultar" : "Mostrar";
      });
    });

    function validateEmail() {
      var el = document.getElementById("login-email");
      var field = document.getElementById("field-email");
      var ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.value.trim());
      field.classList.toggle("has-error", !ok);
      return ok;
    }
    function validatePassword() {
      var el = document.getElementById("login-password");
      var field = document.getElementById("field-password");
      var ok = el.value.trim().length > 0;
      field.classList.toggle("has-error", !ok);
      return ok;
    }
    document.getElementById("login-email").addEventListener("blur", validateEmail);
    document.getElementById("login-password").addEventListener("blur", validatePassword);

    document.getElementById("login-form").addEventListener("submit", function (e) {
      var okEmail = validateEmail();
      var okPass = validatePassword();
      if (!okEmail || !okPass) {
        e.preventDefault();
        SBAI.toast.show("Revisa los campos marcados antes de continuar.", { type: "error" });
      }
    });

    document.getElementById("sso-btn").addEventListener("click", function () {
      SBAI.toast.show("El inicio de sesión por SSO corporativo no está disponible en esta versión. Usa tu correo y contraseña.", { type: "error" });
    });
  });
</script>
</body>
</html>
