<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocupación del equipo · SkillBridge AI</title>
<link rel="stylesheet" href="../../static/css/tokens.css">
<link rel="stylesheet" href="../../static/css/base.css">
<link rel="stylesheet" href="../../static/css/components.css">
<link rel="stylesheet" href="../../static/css/layout.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sbai-sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="sbai-topbar"></header>
    <main class="page-content" id="page-content">

      <div class="kpi-grid" id="kpi-grid"></div>

      <section class="card card-pad" style="margin-top:var(--space-6);">
        <div class="card-header-icon-row" style="margin-bottom:2px;">
          <span class="card-header-icon blue"><svg class="icon icon-sm"><use href="../../static/img/icons.svg#icon-bar-chart"></use></svg></span>
          <h2 style="font-size:var(--fs-md);">Evolución de la ocupación promedio</h2>
        </div>
        <p class="text-tertiary" style="font-size:var(--fs-xs); margin-bottom:var(--space-5); margin-left:44px;">Últimos 6 meses · meta 85% · pasa el mouse o toca una barra</p>
        <div class="bar-chart" id="evo-chart" style="position:relative;"></div>
      </section>

      <section class="card" style="margin-top:var(--space-6); display:flex; flex-direction:column; height:calc(100vh - var(--topbar-h) - (var(--space-6) * 2)); overflow:hidden;">
        <div class="table-toolbar" style="flex-shrink:0;">
          <div>
            <div class="card-header-icon-row">
              <span class="card-header-icon violet"><svg class="icon icon-sm"><use href="../../static/img/icons.svg#icon-layers"></use></svg></span>
              <div>
                <strong>Ocupación individual</strong>
                <p class="text-tertiary" style="font-size:var(--fs-xs); margin-top:2px;">Promedio de las últimas 6 semanas por colaborador</p>
              </div>
            </div>
          </div>
          <div class="table-filters">
            <select class="select" id="celula-filter">
              <option value="todos">Célula: todas</option><option>Andes</option><option>Aurora</option><option>Retail</option><option>Interno</option>
            </select>
            <select class="select" id="estado-filter">
              <option value="todos">Estado: todos</option><option value="level-low">Subutilizado</option><option value="level-optimal">Óptimo</option><option value="level-high">Al límite</option><option value="level-over">Sobre-asignado</option>
            </select>
          </div>
        </div>

        <div class="table-scroll-wrap">
          <div class="table-scroll">
            <table class="data-table">
              <thead class="sticky-head"><tr><th>Colaborador</th><th>Célula</th><th>Cargo</th><th>Ocupación promedio</th><th>Estado</th><th>Acciones</th></tr></thead>
              <tbody id="ocup-body"></tbody>
            </table>
          </div>
          <div class="state-panel" id="ocup-empty" hidden>
            <span class="state-panel-icon"><svg class="icon"><use href="../../static/img/icons.svg#icon-layers"></use></svg></span>
            <span class="state-panel-title">Sin colaboradores con estos filtros</span>
          </div>
        </div>

        <div class="table-footer" style="flex-shrink:0;">
          <span class="text-tertiary" style="font-size:var(--fs-xs);" id="ocup-pagination-count"></span>
          <div class="pagination" id="ocup-pagination-controls"></div>
        </div>
      </section>

    </main>
  </div>
</div>

<script src="../../static/js/mock-data.js"></script>
<script src="../../static/js/state.js"></script>
<script src="../../static/js/toast.js"></script>
<script src="../../static/js/dropdown.js"></script>
<script src="../../static/js/table-filter.js"></script>
<script src="../../static/js/command-palette.js"></script>
<script src="../../static/js/modal.js"></script>
<script src="../../static/js/shell.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var cfg = SBAI.shell.init({ role: "resource-manager", active: "ocupacion.html", title: "Ocupación del equipo", subtitle: "Detalle por colaborador y evolución mensual" });
  if (!cfg) return;

  var b = MOCK.occupancyBuckets;
  document.getElementById("kpi-grid").innerHTML = [
    { label: "SUBUTILIZADOS", value: b.subutilizados, meta: "< 60% de carga", icon: "icon-trending-down", accent: "blue" },
    { label: "ÓPTIMO", value: b.optimo, meta: "60–89% de carga", cls: "up", icon: "icon-check-circle", accent: "green" },
    { label: "AL LÍMITE", value: b.alLimite, meta: "90–100% de carga", cls: "warn", icon: "icon-zap", accent: "amber" },
    { label: "SOBRE-ASIGNADOS", value: b.sobreAsignados, meta: "> 100% de carga", cls: "down", icon: "icon-alert-triangle", accent: "red" }
  ].map(function (k) {
    return '<div class="kpi-tile accent-' + k.accent + '"><span class="kpi-tile-icon ' + k.accent + '"><svg class="icon icon-sm"><use href="../../static/img/icons.svg#' + k.icon + '"></use></svg></span><span class="kpi-tile-label">' + k.label + '</span><span class="kpi-tile-value">' + k.value + '</span><span class="kpi-tile-meta ' + (k.cls || "") + '">' + k.meta + '</span></div>';
  }).join("");

  var META = 85;
  var maxEvo = 100;
  function evoBarColor(pct) {
    if (pct >= META) return "var(--green-fg)";
    if (pct >= META - 15) return "var(--amber-fg)";
    return "var(--red-fg)";
  }
  document.getElementById("evo-chart").innerHTML = MOCK.occupancyMonthly.map(function (m, i) {
    var prev = i > 0 ? MOCK.occupancyMonthly[i - 1].pct : null;
    var delta = prev !== null ? m.pct - prev : null;
    var deltaHtml = delta !== null
      ? '<div class="bar-chart-delta ' + (delta >= 0 ? "up" : "down") + '">' + (delta >= 0 ? "▲" : "▼") + " " + Math.abs(delta) + "pts</div>"
      : '<div class="bar-chart-delta" style="visibility:hidden;">▲ 0pts</div>';
    return '<div class="bar-chart-col" data-mes="' + m.mes + '" data-pct="' + m.pct + '"><span class="bar-chart-value">' + m.pct + '%</span>' +
      '<div class="bar-chart-track"><div class="bar-chart-fill" data-target-h="' + Math.round((m.pct / maxEvo) * 100) + '" style="height:0%; background:' + evoBarColor(m.pct) + ';"></div></div>' +
      '<span class="bar-chart-label">' + m.mes + '</span>' + deltaHtml + "</div>";
  }).join("");

  // Posiciona la línea de meta midiendo el alto real ya renderizado del
  // track (no un número fijo a ojo), para que quede exacta sin importar
  // cuánto espacio ocupen los deltas/etiquetas alrededor.
  var chartEl = document.getElementById("evo-chart");
  var trackEl = chartEl.querySelector(".bar-chart-track");
  var chartRect = chartEl.getBoundingClientRect();
  var trackRect = trackEl.getBoundingClientRect();
  var metaTopPx = (trackRect.top - chartRect.top) + trackRect.height * (1 - META / 100);
  var metaLine = document.createElement("div");
  metaLine.className = "bar-chart-meta-line";
  metaLine.style.top = metaTopPx + "px";
  metaLine.innerHTML = '<span class="bar-chart-meta-label">Meta ' + META + '%</span>';
  chartEl.appendChild(metaLine);

  document.querySelectorAll(".bar-chart-fill[data-target-h]").forEach(function (bar, i) {
    setTimeout(function () { bar.style.height = bar.dataset.targetH + "%"; }, 100 + i * 70);
  });
  document.querySelectorAll(".bar-chart-col").forEach(function (col) {
    col.addEventListener("click", function () {
      var mes = col.dataset.mes, pct = col.dataset.pct;
      var faltan = 85 - pct;
      SBAI.toast.show("<strong>" + mes + "</strong>: " + pct + "% de ocupación promedio" + (faltan > 0 ? " · " + faltan + " pts bajo la meta (85%)" : " · sobre la meta"), { icon: "icon-bar-chart" });
    });
  });

  function levelInfo(v) {
    if (v > 100) return { cls: "level-over", badge: "badge-red", label: "Sobre-asignado" };
    if (v >= 90) return { cls: "level-high", badge: "badge-amber", label: "Al límite" };
    if (v >= 60) return { cls: "level-optimal", badge: "badge-green", label: "Óptimo" };
    return { cls: "level-low", badge: "badge-neutral", label: "Subutilizado" };
  }

  var rows = MOCK.occupancyHeatmap.map(function (row) {
    var c = MOCK.findCollaborator(row.nombre);
    return { row: row, celula: c ? c.celula : "", li: levelInfo(row.promedio) };
  });

  var PAGE_SIZE = 6;
  var currentPage = 1;

  function getFiltered() {
    var celula = document.getElementById("celula-filter").value;
    var estado = document.getElementById("estado-filter").value;
    return rows.filter(function (r) {
      if (celula !== "todos" && r.celula !== celula) return false;
      if (estado !== "todos" && r.li.cls !== estado) return false;
      return true;
    });
  }

  function rowHtml(r, i) {
    var row = r.row, li = r.li;
    return '<tr data-f-estado="' + li.cls + '" style="animation-delay:' + (i * 30) + 'ms;">' +
      '<td class="cell-person"><span class="avatar avatar-sm">' + row.iniciales + '</span><span class="cell-person-name">' + row.nombre + '</span></td>' +
      "<td>" + (r.celula || "—") + "</td><td>" + row.cargo + "</td>" +
      '<td><div class="progress-inline" style="min-width:110px;"><div class="progress-bar"><div class="progress-bar-fill ' + (row.promedio > 100 ? "red" : row.promedio >= 90 ? "amber" : "") + '" data-target="' + Math.min(row.promedio, 100) + '" style="width:0%;"></div></div><span class="progress-value">' + row.promedio + '%</span></div></td>' +
      '<td><span class="badge ' + li.badge + '">' + li.label + '</span></td>' +
      '<td class="cell-actions"><button type="button" data-weekly="' + row.nombre + '">Ver semanas</button>' + (row.promedio > 100 ? '<button type="button" data-rebalance-row="' + row.nombre + '">Rebalancear</button>' : "") + '</td></tr>';
  }

  function wireRowActions() {
    document.querySelectorAll("[data-weekly]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var row = MOCK.occupancyHeatmap.filter(function (r) { return r.nombre === btn.dataset.weekly; })[0];
        var cells = row.valores.map(function (v, i) { return '<div style="text-align:center;"><div class="label-mono" style="margin-bottom:4px;">' + MOCK.occupancyWeeks[i] + '</div><span class="heatmap-cell ' + levelInfo(v).cls + '">' + v + "</span></div>"; }).join("");
        var html = '<div class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><h2>' + row.nombre + '</h2><p>' + row.cargo + ' · promedio ' + row.promedio + '%</p></div>' +
          '<button type="button" class="modal-close" data-modal-close aria-label="Cerrar"><svg class="icon"><use href="../../static/img/icons.svg#icon-x"></use></svg></button></div>' +
          '<div class="modal-body"><div style="display:flex; gap:var(--space-3); justify-content:space-between;">' + cells + '</div></div>' +
          '<div class="modal-footer"><button type="button" class="btn btn-secondary" data-modal-close>Cerrar</button></div></div>';
        SBAI.modal.open(html);
      });
    });
    document.querySelectorAll("[data-rebalance-row]").forEach(function (btn) {
      btn.addEventListener("click", function () { SBAI.toast.show("Propuesta de rebalanceo enviada para <strong>" + btn.dataset.rebalanceRow + "</strong>.", { type: "success" }); });
    });
  }

  function renderPagination(total, totalPages) {
    var countEl = document.getElementById("ocup-pagination-count");
    var controlsEl = document.getElementById("ocup-pagination-controls");
    if (total === 0) { countEl.textContent = ""; controlsEl.innerHTML = ""; return; }
    var start = (currentPage - 1) * PAGE_SIZE + 1;
    var end = Math.min(currentPage * PAGE_SIZE, total);
    countEl.textContent = "Mostrando " + start + "–" + end + " de " + total + " colaboradores";
    if (totalPages <= 1) { controlsEl.innerHTML = ""; return; }
    var html = '<button type="button" class="page-btn" id="pg-prev" ' + (currentPage === 1 ? "disabled" : "") + '>‹</button>';
    for (var i = 1; i <= totalPages; i++) html += '<button type="button" class="page-btn' + (i === currentPage ? " active" : "") + '" data-page="' + i + '">' + i + "</button>";
    html += '<button type="button" class="page-btn" id="pg-next" ' + (currentPage === totalPages ? "disabled" : "") + '>›</button>';
    controlsEl.innerHTML = html;
    var prevBtn = document.getElementById("pg-prev"), nextBtn = document.getElementById("pg-next");
    if (prevBtn) prevBtn.addEventListener("click", function () { if (currentPage > 1) { currentPage--; render(); } });
    if (nextBtn) nextBtn.addEventListener("click", function () { if (currentPage < totalPages) { currentPage++; render(); } });
    controlsEl.querySelectorAll("[data-page]").forEach(function (btn) { btn.addEventListener("click", function () { currentPage = parseInt(btn.dataset.page, 10); render(); }); });
  }

  function render() {
    var filtered = getFiltered();
    var totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    var pageItems = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

    document.getElementById("ocup-body").innerHTML = pageItems.map(rowHtml).join("");
    document.getElementById("ocup-empty").hidden = filtered.length !== 0;
    document.querySelector(".table-scroll table").hidden = filtered.length === 0;

    document.querySelectorAll(".progress-bar-fill[data-target]").forEach(function (bar, i) {
      setTimeout(function () { bar.style.width = bar.dataset.target + "%"; }, 80 + i * 40);
    });

    wireRowActions();
    renderPagination(filtered.length, totalPages);
  }

  document.getElementById("celula-filter").addEventListener("change", function () { currentPage = 1; render(); });
  document.getElementById("estado-filter").addEventListener("change", function () { currentPage = 1; render(); });

  render();
});
</script>
</body>
</html>
