# Perfil activo en Cloud Run (SPRING_PROFILES_ACTIVE=gcp), conectando a
# Cloud SQL por socket unix (así lo monta Cloud Run cuando el servicio se
# despliega con --add-cloudsql-instances). No usa host:puerto TCP.
#
# INSTANCE_CONNECTION_NAME tiene la forma PROYECTO:REGION:INSTANCIA
# (lo entrega "gcloud sql instances describe"). Ver README > "Despliegue en
# GCP" para el detalle completo del comando de despliegue.

spring:
  datasource:
    url: jdbc:mysql:///${DB_NAME:skillbridge}?cloudSqlInstance=${INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
